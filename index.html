<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PPL" />
  <meta name="theme-color" content="#161826" />
  <link rel="manifest" href="#" id="manifest-placeholder" />
  <title>PPL Tracker</title>
  <style>
    /* ── Nocturne: blue-grey bases (#161826), flat opaque surfaces, blurple accent (#9184d9).
       From Ian's Claude Design "PPL Tracker UI redesign". Deviations kept on purpose: filled
       primary buttons (dark text — white fails AA on this accent), per-category workout colors,
       multi-hue charts. Pull is hue-shifted to blue so it never reads as the accent. ── */
    :root {
      --bg:#161826; --surface:#232532; --surface-solid:#232532; --surface-2:#1c1e2b; --surface-3:#2b2e3f;
      --text:#e9e9ed; --text-2:#c6c8d4; --muted:#9295a6; --muted-2:#71747f; --muted-3:#4a4d5c;
      --border:#3f424d; --border-2:#595d6c; --border-3:rgba(233,233,237,0.16);
      --btn-bg:#9184d9; --btn-fg:#161826;
      --accent:#9184d9; --accent-bright:#a29af0; --accent-muted:rgba(145,132,217,0.15);
      --accent-300:#bdb4ea; --accent-100:#e5e1f7;
      --tabbar-bg:rgba(35,37,50,0.92); --shadow:rgba(0,0,0,.55);
      --good:#5fd0a0; --bad:#ff6b6b; --danger:#ff6b6b; --danger-bd:rgba(255,107,107,.4);
      --link:#bdb4ea;
      --push-fg:#e2899e; --push-bg:rgba(226,137,158,.14); --push-bd:rgba(226,137,158,.36); --push-bar:#d97a92;
      --legs-fg:#6bd3a8; --legs-bg:rgba(68,168,132,.14); --legs-bd:rgba(68,168,132,.4); --legs-bar:#44a884;
      --pull-fg:#7fa8e8; --pull-bg:rgba(77,127,214,.16); --pull-bd:rgba(77,127,214,.4); --pull-bar:#4d7fd6;
      --badge-bg:#2b2e3f; --badge-fg:#c6c8d4;
      --flag-fg:#6bd3a8; --flag-bg:rgba(45,122,90,.2); --flag-bd:rgba(45,122,90,.42);
      --warm-fg:#e2b06a; --warm-bg:rgba(226,176,106,.1); --warm-bd:rgba(226,176,106,.26);
      --cardio-fg:#cba4f2; --cardio-bg:rgba(181,127,217,.16); --cardio-bd:rgba(181,127,217,.4); --cardio-bar:#b57fd9; /* orchid — nudged red-ward so it never reads as the blurple accent */
      --chart:#9184d9; --chart-strength:#5fd0a0; --chart-pet:#e2b06a; --chart-axis:#4a4d5e;
      --toast-bg:#2b2e3f; --toast-fg:#e9e9ed;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      -webkit-tap-highlight-color: transparent; padding-bottom: 72px;
    }
    .container { max-width: 520px; margin: 0 auto; padding: 20px 16px 24px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
    h2 { font-size: 16px; font-weight: 700; margin: 18px 0 10px; }

    /* Cards */
    .card { background: var(--surface); border-radius: 12px; padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    /* Buttons */
    button { font-family: inherit; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; padding: 11px 16px; background: var(--btn-bg); color: var(--btn-fg); transition: opacity .15s; }
    .btn:active { opacity: .7; }
    .btn-block { width: 100%; }
    .btn-ghost { background: var(--surface); color: var(--text); border: 1.5px solid var(--border-2); }
    .btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
    .btn-danger { background: var(--surface); color: var(--danger); border: 1.5px solid var(--danger-bd); }

    /* Workout accent chips */
    .pill { font-size: 11px; font-weight: 700; letter-spacing: .5px; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; display: inline-block; }
    .acc-push { color: var(--push-fg); background: var(--push-bg); border: 1.5px solid var(--push-bd); }
    .acc-legs { color: var(--legs-fg); background: var(--legs-bg); border: 1.5px solid var(--legs-bd); }
    .acc-pull { color: var(--pull-fg); background: var(--pull-bg); border: 1.5px solid var(--pull-bd); }
    .acc-bar-push { background: var(--push-bar); }
    .acc-bar-legs { background: var(--legs-bar); }
    .acc-bar-pull { background: var(--pull-bar); }

    .range-badge { font-size: 11px; font-weight: 700; color: var(--badge-fg); background: var(--badge-bg); border-radius: 6px; padding: 2px 8px; }
    .flag { font-size: 11px; font-weight: 700; color: var(--flag-fg); background: var(--flag-bg); border: 1px solid var(--flag-bd); border-radius: 6px; padding: 2px 8px; }

    /* Exercise log card */
    .ex-card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; overflow: hidden; }
    .ex-accent { height: 4px; }
    .ex-body { padding: 14px 14px 12px; }
    .ex-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .ex-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ex-title { font-size: 14px; font-weight: 700; }
    .lasttime { font-size: 12px; color: var(--text-2); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; margin: 6px 0 10px; line-height: 1.5; }
    .last-note { font-size: 12px; color: var(--warm-fg); background: var(--warm-bg); border: 1px solid var(--warm-bd); border-radius: 8px; padding: 7px 9px; margin: -4px 0 10px; line-height: 1.5; }
    select, input, textarea { font-family: inherit; font-size: 14px; border: 1.5px solid var(--border-2); border-radius: 8px; padding: 9px 10px; background: var(--surface); color: var(--text); width: 100%; }
    input[type=checkbox] { width: 20px; height: 20px; min-width: 20px; padding: 0; border: none; accent-color: var(--accent); }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--text); }
    .set-grid { display: grid; grid-template-columns: 20px 1fr 1fr 16px 24px 24px; gap: 5px; align-items: center; margin-bottom: 7px; }
    .tgt-badge { font-size: 13px; font-weight: 800; text-align: center; line-height: 1; }
    .tgt-badge.beat { color: var(--good); }
    .tgt-badge.tie { color: var(--muted); }
    .tgt-badge.over { color: var(--warm-fg); }
    .tgt-badge.under { color: var(--bad); }
    .coach { font-size: 12px; line-height: 1.5; border-radius: 8px; padding: 7px 10px; margin: 6px 0 10px; color: var(--text-2); }
    .coach.stall { background: var(--warm-bg); border: 1px solid var(--warm-bd); }
    .coach.deload { background: var(--pull-bg); border: 1px solid var(--pull-bd); }
    .coach-btn { background: none; border: none; color: var(--link); font-weight: 700; font-size: 12px; cursor: pointer; padding: 0; }
    .set-grid .set-no { font-size: 12px; font-weight: 700; color: var(--muted-2); text-align: center; }
    .set-grid input { padding: 8px 6px; text-align: center; }
    .set-grid .colhead { font-size: 10px; font-weight: 700; color: var(--muted-2); text-transform: uppercase; letter-spacing: .5px; text-align: center; }
    .x-set { background: none; border: none; color: var(--muted-3); font-size: 18px; cursor: pointer; line-height: 1; }
    .skip-set { background: none; border: none; color: var(--muted-2); font-size: 16px; cursor: pointer; line-height: 1; }
    .addset { font-size: 12px; font-weight: 600; color: var(--link); background: none; border: none; cursor: pointer; padding: 4px 0; }
    .skip-note { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .skip-note em { font-style: italic; }
    .skip-note button { background: none; border: none; color: var(--link); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .timer-badge { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; white-space: nowrap; }
    .stair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
    .stair-grid label { font-size: 10px; font-weight: 700; color: var(--muted-2); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 4px; }
    .acc-cardio { color: var(--cardio-fg); background: var(--cardio-bg); border: 1.5px solid var(--cardio-bd); }
    .acc-bar-cardio { background: var(--cardio-bar); }
    /* Summary */
    .stat-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 14px 0 12px; }
    .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 8px; text-align: center; }
    .stat-tile .v { font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
    .stat-tile .k { font-size: 10px; font-weight: 700; color: var(--muted-2); text-transform: uppercase; letter-spacing: .4px; margin-top: 3px; }
    .wkbars { display: flex; align-items: flex-end; gap: 8px; height: 76px; }
    .wkbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .wkbar .bar { width: 100%; background: var(--chart); border-radius: 5px 5px 0 0; min-height: 3px; transition: height .2s; }
    .wkbar .lbl { font-size: 9px; color: var(--muted-2); font-weight: 600; }
    .wkbar .cnt { font-size: 10px; font-weight: 700; color: var(--text); min-height: 12px; }
    /* Skincare */
    .day-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .day-btn { padding: 7px 11px; border: 1.5px solid var(--border-2); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--text); position: relative; }
    .day-btn.active { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
    .day-dot { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--bg); }
    .dot-retinol { background: #5aaa8a; } .dot-bha { background: #8a7ac2; }
    .badge-row { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 700; letter-spacing: .5px; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; display: inline-block; }
    .badge-retinol { color: #2d7a5a; background: rgba(90,170,138,.16); border: 1.5px solid #5aaa8a; }
    .badge-bha { color: #6a5ab0; background: rgba(138,122,194,.16); border: 1.5px solid #8a7ac2; }
    .card-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
    .label-am { color: #c88a30; } .label-pm { color: #6a7ad0; }
    .skin-step { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border-3); font-size: 14px; }
    .skin-step:last-child { border-bottom: none; }
    .skin-num { min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; background: var(--surface-3); color: var(--text-2); }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .phase-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
    .phase-header { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border: none; background: transparent; cursor: pointer; text-align: left; color: var(--text); }
    .phase-num { width: 26px; height: 26px; border-radius: 8px; background: var(--btn-bg); color: var(--btn-fg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .phase-title { font-size: 15px; font-weight: 600; }
    .phase-count { font-size: 12px; color: var(--muted-2); }
    .phase-body { padding: 0 16px 14px; }
    .phase-body p { font-size: 13px; color: var(--text-2); line-height: 1.55; margin-bottom: 8px; }
    .phase-body p:last-child { margin-bottom: 0; }
    .phase-body ul { margin: 0 0 8px 18px; }
    .phase-body li { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 4px; }
    .shave-step { padding: 10px 0; border-top: 1px solid var(--border-3); }
    .shave-step-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .shave-step-note { font-size: 13px; color: var(--text-2); line-height: 1.5; }

    /* Warmup */
    .warm { margin-top: 8px; }
    .warm-toggle { font-size: 12px; font-weight: 600; color: var(--warm-fg); background: none; border: none; cursor: pointer; padding: 2px 0; }
    .warm-table { margin-top: 6px; font-size: 12px; color: var(--text-2); background: var(--warm-bg); border: 1px solid var(--warm-bd); border-radius: 8px; padding: 8px 10px; }
    .warm-table div { display: flex; justify-content: space-between; padding: 2px 0; align-items: flex-start; gap: 12px; }
    /* Per-rung plate breakdown stacks under its label — override the row's flex, which would
       otherwise catch this nested div via the descendant selector above. */
    .warm-table .warm-plates { display: block; font-size: 11px; color: var(--muted); padding: 1px 0 0; }

    /* Tab bar */
    .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--tabbar-bg); backdrop-filter: blur(8px); border-top: 1px solid var(--border); display: flex; flex-direction: column; z-index: 50; }
    .tabbar-inner { max-width: 520px; margin: 0 auto; width: 100%; display: flex; }
    .stopwatch { max-width: 520px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    .stopwatch .sw-label { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .stopwatch .sw-time { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 19px; transition: color .2s; }
    .stopwatch .sw-time.in { color: var(--good); }
    .stopwatch .sw-time.over { color: var(--push-fg); }
    .stopwatch .sw-target { flex: 1; font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stopwatch .sw-target.in { color: var(--good); }
    .sw-btn { border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--btn-bg); color: var(--btn-fg); }
    .sw-btn.sw-clear { background: var(--surface-3); color: var(--text); padding: 7px 12px; }
    body.sw-on { padding-bottom: 124px; }
    .tab { flex: 1; background: none; border: none; cursor: pointer; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted-2); font-size: 10px; font-weight: 600; }
    .tab.active { color: var(--text); }
    .tab .ic { font-size: 19px; line-height: 1; display: flex; }

    /* Phosphor icons. Sized in em on purpose: several call sites already set the icon size with
       an inline font-size on a wrapper span, and em keeps those working untouched. */
    .ph { width: 1.15em; height: 1.15em; vertical-align: -.22em; flex: 0 0 auto; }
    .card-label .ph, h2 .ph, h3 .ph { width: 1em; height: 1em; vertical-align: -.13em; margin-right: .38em; }
    .tab .ic .ph { width: 22px; height: 22px; vertical-align: 0; }
    .fab .ph { width: 24px; height: 24px; }
    .btn .ph { vertical-align: -.18em; margin-right: .3em; }
    .ph.lead { margin-right: .38em; }   /* icon sitting before text outside a button/heading */
    .x-set .ph { width: 15px; height: 15px; }
    .skip-set .ph { width: 15px; height: 15px; }
    .sw-label .ph { margin-right: .3em; }
    .fab .ph, .btn .ph:only-child { margin-right: 0; }

    /* History */
    .hist-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-3); cursor: pointer; }
    .hist-item:last-child { border-bottom: none; }
    .hist-detail { font-size: 13px; color: var(--text-2); line-height: 1.6; padding: 4px 0 10px; }

    /* Weight chart */
    .stat-big { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
    .stat-sub { font-size: 13px; color: var(--muted); }
    .trend-up { color: var(--bad); } .trend-down { color: var(--good); } .trend-flat { color: var(--muted); }
    svg { display: block; width: 100%; }

    .empty { text-align: center; color: var(--muted-2); font-size: 13px; padding: 30px 10px; }
    .hidden { display: none !important; }
    .seg { display: flex; gap: 6px; background: var(--surface-3); border-radius: 10px; padding: 4px; margin-bottom: 14px; }
    .seg button { flex: 1; padding: 7px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; background: transparent; color: var(--muted); }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px var(--shadow); }
    .toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-fg); font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 22px; z-index: 230; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    /* Floating idea/feedback button + capture sheet */
    .fab { position: fixed; right: 16px; bottom: 88px; width: 50px; height: 50px; border-radius: 50%; background: var(--btn-bg); color: var(--btn-fg); border: none; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 14px var(--shadow); z-index: 60; cursor: pointer; transition: bottom .2s, opacity .15s; }
    .fab:active { opacity: .7; }
    body.sw-on .fab { bottom: 140px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 210; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-card { background: var(--surface); width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 82vh; overflow-y: auto; }
    .idea-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-3); }
    .idea-item:last-child { border-bottom: none; }
    .idea-item .txt { flex: 1; font-size: 14px; line-height: 1.45; }
    .idea-item.done .txt { text-decoration: line-through; color: var(--muted); }

    /* ─────────── Nocturne effect layer: flat surfaces, hairline elevation, blurple accent ───────────
       Elevation is "an edge plus ambient darkness" — cards get their hairline from the base
       border (var(--border) is the #3f424d hairline), NOT translucency. backdrop-filter is
       reserved for the tab bar alone; dropping it from every card is also a real scroll-perf win. */
    body { background: var(--bg); }

    /* Buttons: filled blurple w/ dark text (deliberate deviation from Nocturne's outlined
       buttons — the pops stay); toned glow on hover; precise expo-out press */
    .btn { transition: all .2s cubic-bezier(0.16,1,0.3,1); }
    .btn:active { transform: scale(.98); opacity: 1; }
    .btn:not(.btn-ghost):not(.btn-danger) { box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
    .btn:not(.btn-ghost):not(.btn-danger):hover { background: var(--accent-bright); box-shadow: 0 4px 14px rgba(145,132,217,0.35); }
    .btn-ghost { background: transparent; }
    .btn-ghost:hover { background: rgba(233,233,237,.05); border-color: var(--border-2); }

    /* Global focus + selection in the accent (replaces the old per-class box-shadow rings) */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ::selection { background: rgba(145,132,217,.30); }

    /* Inputs: one step darker than surface, accent focus ring */
    select, input, textarea { background: var(--surface-2); }
    select:focus, input:focus, textarea:focus { border-color: rgba(145,132,217,.7); box-shadow: 0 0 0 3px rgba(145,132,217,.2); outline: none; }
    input[type=checkbox] { accent-color: var(--accent); }

    /* Tab bar (the one sanctioned glass surface) + FAB */
    .tabbar { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .tab.active { color: var(--accent); }
    .fab { box-shadow: 0 3px 14px var(--shadow), 0 0 22px rgba(145,132,217,.35); }
    .fab:hover { box-shadow: 0 3px 14px var(--shadow), 0 0 30px rgba(145,132,217,.5); }

    /* Fading-edge dividers — the Nocturne signature. .hist-item covers weight entries, workout
       history, PRs, strength history, trash and version lists in one rule. */
    .hist-item { border-bottom: 1px solid transparent; border-image: linear-gradient(to right, transparent, var(--border-3) 48px, var(--border-3) calc(100% - 48px), transparent) 1; }

    /* Technical mono labels; headlines are plain text (weight/size hierarchy, no gradient fill) */
    .card-label, .stat-tile .k, .set-grid .colhead, .pill, .badge, .range-badge, .flag, .sw-label, .stair-grid label { font-family: var(--font-mono); }
    h1, h2 { letter-spacing: -0.02em; }
  </style>
  <!-- Firebase (Auth + Firestore) for cross-device sync. Deferred so they never block boot;
       the app is fully functional offline / signed-out without them. -->
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  const manifest = { name:"PPL Tracker", short_name:"PPL", start_url:"./", display:"standalone", background_color:"#161826", theme_color:"#161826",
    icons:[{src:icon(192),sizes:"192x192",type:"image/svg+xml"},{src:icon(512),sizes:"512x512",type:"image/svg+xml"}] };
  document.getElementById('manifest-placeholder').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
  const sw = `
    const C='ppl-shell-v1';
    self.addEventListener('install',e=>{ e.waitUntil(caches.open(C).then(c=>c.addAll(['./','./index.html']).catch(()=>{}))); self.skipWaiting(); });
    self.addEventListener('activate',e=>{ e.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch',e=>{
      const req=e.request; if(req.method!=='GET') return;
      if(new URL(req.url).origin!==self.location.origin) return; // Firebase/gstatic bypass the SW entirely
      e.respondWith(
        fetch(req).then(res=>{ const copy=res.clone(); caches.open(C).then(c=>c.put(req,copy)).catch(()=>{}); return res; })
        .catch(()=> caches.match(req).then(r=> r || (req.mode==='navigate' ? caches.match('./index.html') : undefined)))
      );
    });`;
  if('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:'./'}).catch(()=>{});
})();

/* ───────────────────────── Storage ───────────────────────── */
const KEY = "ppl_tracker_v1";
const SCHEMA = 14;
const DEFAULT_HOBBIES = ["🎨 Mini-painting","🏔️ Terrain crafting","🧹 Clean up the workspace","📦 Organize the basement","🛹 Learn to longboard","📖 Read a book outside","🌿 Pull weeds","✂️ Edge & trim the lawn","🛏️ Clean the bedroom","🚿 Clean the bathroom","🧘 Do yoga with Rachel","🥏 Toss a disc with Rachel","📞 Make plans with Kevin","🎾 Throw the ball with Charlie"];
const HOBBY_SEED_V2 = ["🌿 Pull weeds","✂️ Edge & trim the lawn","🛏️ Clean the bedroom","🚿 Clean the bathroom","🧘 Do yoga with Rachel","🥏 Toss a disc with Rachel","📞 Make plans with Kevin","🎾 Throw the ball with Charlie"];
const HOBBIES_DEFAULT = ["🎨 Mini-painting","🏔️ Terrain crafting","🛹 Longboard","📖 Read a book outside","🧘 Do yoga with Rachel","🥏 Toss a disc with Rachel","📞 Make plans with Kevin","🎾 Throw the ball with Charlie","🐾 Play with Freddie"];
const PRODUCTIVITY_DEFAULT = ["🧹 Clean up crafting station","🗂️ Clean off work desk","📦 Organize the basement","🌀 Vacuum the basement","🌿 Pull weeds","✂️ Edge and trim the lawn","🛏️ Clean the bedroom","🚿 Clean the bathroom","🍱 Meal prep","💼 Clean the office room","🛋️ Wash couch cushions","🍳 Clean the stovetop","🧊 Clean out the fridge"];
/* Ordered schema migrations. Each takes the data object up one version. Must be idempotent. */
const MIGRATIONS = {
  1:d=>{ if(!d.hobbies) d.hobbies=DEFAULT_HOBBIES.slice(); if(!d.hobbyLog) d.hobbyLog=[]; if(!('lawn' in d)) d.lawn=null; if(!('wx' in d)) d.wx=null; return d; },
  2:d=>{ if(!d.journal) d.journal={}; return d; },
  3:d=>{ if(!d.hobbySeedV2){ HOBBY_SEED_V2.forEach(h=>{ if(!d.hobbies.includes(h)) d.hobbies.push(h); }); d.hobbySeedV2=true; } return d; },
  4:d=>{ // split the single list into Hobbies + Productivity, keeping any custom adds
    if(!d.productivity) d.productivity=PRODUCTIVITY_DEFAULT.slice();
    const customs=(d.hobbies||[]).filter(h=> !DEFAULT_HOBBIES.includes(h)); // anything added beyond the old defaults
    d.hobbies=HOBBIES_DEFAULT.slice();
    customs.forEach(h=>{ if(!d.hobbies.includes(h) && !d.productivity.includes(h)) d.hobbies.push(h); });
    return d; },
  5:d=>{ // daily mobility log; fold any per-session mobility into it
    if(!d.mobilityLog) d.mobilityLog={};
    (d.sessions||[]).forEach(s=>{ if(s.extras && s.extras.mobility){ const done=Object.entries(s.extras.mobility).filter(([k,v])=>v); if(done.length) d.mobilityLog[s.date]=Object.assign({}, d.mobilityLog[s.date]||{}, Object.fromEntries(done)); delete s.extras.mobility; } });
    return d; },
  6:d=>{ if(!d.todos) d.todos=[]; return d; }, // rolling to-do list
  7:d=>{ if(!d.cardio) d.cardio=[]; return d; }, // cardio / Strava log
  8:d=>{ if(!d.ideas) d.ideas=[]; return d; }, // in-app dev-idea capture
  9:d=>{ (d.sessions||[]).forEach((s,i)=>{ if(!s.id) s.id='s'+i+'_'+(s.date||'')+'_'+(s.endedAt||'h'); }); return d; }, // stable session ids (enables edit-in-place)
  10:d=>{ if(!d.lawnLog) d.lawnLog={}; return d; }, // adaptive lawn watering/mowing log
  11:d=>{ if(typeof d.routineMode!=='string') d.routineMode='4day'; return d; }, // 4-Day PPL toggle
  /* Skipped days were pushed with no id (skipDay predated ids), so they'd all collide on a single
     undefined merge key. Backfill from content — never from array index, which differs per device. */
  12:d=>{ (d.sessions||[]).forEach(s=>{ if(!s.id) s.id='s_'+(s.date||'')+'_'+(s.workout||'').replace(/\s+/g,'')+'_'+(s.endedAt||(s.skipped?'skip':'h')); }); return d; },
  /* Generation counter for wholesale replace (Erase all data / Import→Replace). Keep this a PURE
     literal: MIGRATIONS runs during `let DB = load()` far above the merge-key consts, and a TDZ
     ReferenceError here would be swallowed by the silent catch below while _schema still advances,
     permanently skipping the migration. */
  13:d=>{ if(typeof d.gen!=='number') d.gen=0; return d; },
  14:d=>{ if(!Array.isArray(d.petWeights)) d.petWeights=[]; if(typeof d.petName!=='string') d.petName='Freddie'; return d; } // daily cat weigh-in
};
/* The ONE place raw data becomes valid app data. Both load() and importData() go through here. */
function normalize(raw){
  let d = (raw && typeof raw==='object') ? raw : blank();
  d.sessions = Array.isArray(d.sessions) ? d.sessions : [];
  d.weights  = Array.isArray(d.weights)  ? d.weights  : [];
  d.petWeights = Array.isArray(d.petWeights) ? d.petWeights : [];
  if(typeof d.unit!=='string') d.unit='lb';
  if(typeof d.petName!=='string') d.petName='Freddie';
  if(typeof d.gen!=='number') d.gen=0;   // defensive: migration 13 runs in a silent try/catch
  for(let v=(d._schema||0)+1; v<=SCHEMA; v++){ try{ d = MIGRATIONS[v](d) || d; }catch(e){} }
  /* Never DOWNGRADE: a device running a stale cached index.html would otherwise stamp an older
     schema onto the shared blob and make the newer device re-run migrations (migration 4 is not
     idempotent — it resets hobbies, resurrecting deleted ones). */
  d._schema = Math.max(SCHEMA, +d._schema || 0);
  return d;
}
let DB = load();
function load(){ try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ return blank(); } }
function blank(){ return { _schema:SCHEMA, gen:0, sessions:[], weights:[], petWeights:[], petName:"Freddie", draft:null, unit:"lb", routineMode:"4day", hobbies:HOBBIES_DEFAULT.slice(), productivity:PRODUCTIVITY_DEFAULT.slice(), hobbyLog:[], journal:{}, mobilityLog:{}, todos:[], cardio:[], ideas:[], lawnLog:{}, lawn:null, wx:null, hobbySeedV2:true }; }

/* ── Soft delete ─────────────────────────────────────────────────────────────────────────────
   Deleting used to splice the row out, but sync UNIONS both devices — so the cloud copy came
   straight back on the next merge and the row resurrected forever. Now a delete flags the row

  const dw = lastW>0 ? String(round5(lastW*0.9)) : '';
  e.deload=true; e.sets.forEach(st=>{ if(!st.skipped) st.w=dw; });
  save(); render();
}
function undeloadExercise(i){ DB.draft.entries[i].deload=false; save(); render(); }
/* Strength is tracked PER EXERCISE (not pooled by muscle) so the trend reflects one
   movement — "DB bench" rising — instead of jumping between bench/incline/fly. */
/* All logged exercises in a session = main entries + abs/forearms accessories. */
function sessionExercises(s){
  const list = (s.entries||[]).slice();
  if(s.extras) Object.keys(s.extras).forEach(w=>{ const e=s.extras[w]; if(e && e.name && e.sets && e.sets.length) list.push(e); });
  return list;
}
function exercisesWithData(){
  const set=new Set();
  liveSessions().forEach(s=>{ if(s.skipped) return; sessionExercises(s).forEach(e=>{ if(e.sets.some(x=>!x.skipped && e1rm(x.w,x.r)>0)) set.add(e.name); }); });
  return [...set].sort();
}
function exerciseSeries(name){
  const out=[];
  liveSessions().forEach(s=>{ if(s.skipped) return; let best=0;
    sessionExercises(s).forEach(e=>{ if(e.name!==name) return; e.sets.forEach(x=>{ if(!x.skipped){ const v=e1rm(x.w,x.r); if(v>best) best=v; } }); });
    if(best>0) out.push({date:s.date, value:best}); });
  return out;
}
/* A PR is moving up in WEIGHT: the heaviest load ever put on an exercise, reps irrelevant. Beating
   an old set on reps alone is progress the ✓ badge already marks — it isn't a trophy. Bodyweight
   sets (blank or 0) can't PR by definition, since there's no load to raise. */
const setLoad = x => (x.w===''||x.w==null) ? 0 : +x.w;
/* The rep range each logged exercise was performed under, keyed by the entry object: main entries
   take their slot's range (including the per-exercise override, e.g. Goblet squat 12–15),
   accessories take their ACCESSORIES range. NULL when the workout or slot can't be resolved
   (legacy rows, a renamed program) — callers must read null as "no constraint" so a lookup miss
   never silently revokes an old trophy. */
function sessionRanges(s){
  const out = new Map();
  const slots = (PROGRAM[s.workout] && PROGRAM[s.workout].slots) || null;
  (s.entries||[]).forEach((e,i)=>{ const slot = slots && slots[i]; out.set(e, slot ? effRange(slot, e.name) : null); });
  if(s.extras) Object.keys(s.extras).forEach(id=>{ const e=s.extras[id]; if(!e || !e.name || !e.sets || !e.sets.length) return;
    const a=ACCESSORIES[id]; out.set(e, a ? {lo:a.lo, hi:a.hi} : null); });
  return out;
}
/* A PR has to be real work, not a heavy single: the trophy set must land inside the prescribed rep
   range. Other sets that session are irrelevant — a backoff set never costs you the PR. */
const prEligible = (rng, x) => !rng || (+x.r >= rng.lo && +x.r <= rng.hi);
function exercisePRs(){
  const map={};
  liveSessions().forEach(s=>{ if(s.skipped) return; const rngs=sessionRanges(s); sessionExercises(s).forEach(e=>{
    const rng=rngs.get(e);
    e.sets.forEach(x=>{ if(x.skipped || x.r==='' || !prEligible(rng,x)) return; const v=setLoad(x); if(v>0 && (!map[e.name] || v>map[e.name].v)) map[e.name]={v, w:x.w, r:x.r, date:s.date}; }); }); });
  return Object.entries(map).map(([name,d])=>({name,...d})).sort((a,b)=>b.v-a.v);
}
/* Which individual sets were PRs, resolved live by replaying every session in date order against a
   running heaviest-per-exercise. Deriving it beats trusting the `prs` array stamped at save time:
   editing or deleting a session re-settles every trophy instead of stranding a stale one.
   At most one trophy per exercise per session — the heaviest set that cleared the old best, not
   every set on the way up. Keyed by the session object, so sessions predating `id` still work. */
function prSetIndex(){
  const best={}, bySession=new Map();
  liveSessions().forEach(s=>{ if(s.skipped) return;
    const marks=new Set(), rngs=sessionRanges(s);
    sessionExercises(s).forEach(e=>{
      let topV=0, topK=-1; const rng=rngs.get(e);
      e.sets.forEach((x,k)=>{
        if(x.skipped || x.r==='' || !prEligible(rng,x)) return;   // same gate as exercisePRs — these two must never disagree
        const v=setLoad(x); if(v>topV){ topV=v; topK=k; }
      });
      if(topV>0 && (best[e.name]==null || topV>best[e.name])){
        best[e.name]=topV;
        marks.add(`${e.name}|${topK}`);
      }
    });
    if(marks.size) bySession.set(s, marks);
  });
  return {
    isPR:(s,name,k)=> !!(bySession.get(s)||{has:()=>false}).has(`${name}|${k}`),
    sessionHasPR:s=> bySession.has(s),
  };
}
/* Bodyweight exercises (weight-0 sets with reps) that aren't tracked as loaded lifts. */
function bwExercisesWithData(){
  const loaded=new Set(exercisesWithData()), set=new Set();
  liveSessions().forEach(s=>{ if(s.skipped) return; sessionExercises(s).forEach(e=>{ if(loaded.has(e.name)) return;
    if(e.sets.some(x=>!x.skipped && x.r!=='' && (x.w===''||+x.w===0))) set.add(e.name); }); });
  return [...set].sort();
}
function bwSeries(name){
  const out=[];
  liveSessions().forEach(s=>{ if(s.skipped) return; let total=0, has=false;
    sessionExercises(s).forEach(e=>{ if(e.name!==name) return; e.sets.forEach(x=>{ if(!x.skipped && x.r!==''){ total+=+x.r; has=true; } }); });
    if(has) out.push({date:s.date, value:total}); });
  return out;
}
/* Working sets per muscle in the current week (main slots' muscle + Abs/Forearms). */
function weeklySetsByMuscle(){
  const m=+monday(new Date()), counts={};
  const add=(mus,n)=>{ if(mus&&n) counts[mus]=(counts[mus]||0)+n; };
  liveSessions().forEach(s=>{ if(s.skipped || +monday(new Date(s.date+'T00:00'))!==m) return;
    (s.entries||[]).forEach((e,idx)=>{ const sl=PROGRAM[s.workout]&&PROGRAM[s.workout].slots[idx]; add(sl&&sl.muscle, e.sets.filter(x=>!x.skipped && x.r!=='').length); });
    if(s.extras) Object.keys(s.extras).forEach(w=>{ const e=s.extras[w]; if(e&&e.sets){ const mus=(ACCESSORIES[w]&&ACCESSORIES[w].muscle)||(w.charAt(0).toUpperCase()+w.slice(1)); add(mus, e.sets.filter(x=>!x.skipped && x.r!=='').length); } });
  });
  return counts;
}

  return { temp:Math.round(cur?cur.temperature:dy.temperature_2m_max[ti]), icon:c.icon, text:c.text,
    hi:Math.round(dy.temperature_2m_max[ti]), lo:Math.round(dy.temperature_2m_min[ti]),
    rainProb:Math.round(dy.precipitation_probability_max[ti]||0), loc:(DB.lawn&&DB.lawn.label)||'' };

/* When (not just whether) it'll rain today — answers "is it going to rain?" without opening a
   weather app. Scans the hourly forecast already fetched for the lawn logic; first remaining hour
   with ≥0.02" precip → "~3pm". Null when dry / no forecast / offline (never throws). */
function rainTiming(){
  try{
    const h = DB.wx && DB.wx.data && DB.wx.data.hourly;
    if(!h || !h.time || !h.precipitation) return null;
    const today = todayISO(), nowHr = new Date().getHours();
    for(let i=0;i<h.time.length;i++){
      const t = h.time[i]; if(t.slice(0,10)!==today) continue;
      const hr = +t.slice(11,13); if(hr < nowHr) continue;
      if(+h.precipitation[i] >= 0.02) return '~'+fmtHour(hr);
    }
    return null;
  }catch(e){ return null; }
}

          <div><div style="font-weight:700;font-size:15px">🐈 ${esc(petName())} — ${pw? `${(+pw.value).toFixed(1)} <span class="muted" style="font-size:12px;font-weight:600">${DB.unit}</span>` : '<span class="muted">no weigh-ins yet</span>'}</div>
          <div class="stat-sub">${pw? (petToday?'logged today':'last '+fmtDate(pw.date)) : 'weigh him on the same scale'}</div></div>
          <button class="btn btn-sm btn-ghost" onclick="progSub='pet';goSub('train','progress')">Chart</button>
        </div>
        ${weighOpen && !petToday ? logRow('pet-input',"logPetWeight('pet-input')",`${esc(petName())}&#39;s weight (${DB.unit})`) : ''}
      </div>
    </div>`;
  const rainAt = rainTiming();
  const cWeather = gl ? `<div class="card" style="cursor:pointer" onclick="goSub('care','lawn')"><div class="row">
      <div><div style="font-weight:700;font-size:16px">${gl.icon} ${gl.temp}° · ${gl.text}</div>
      <div class="muted" style="font-size:12px;margin-top:2px">H ${gl.hi}° / L ${gl.lo}°${rainAt?` · <span style="color:var(--accent-300);font-weight:600">rain ${rainAt}</span>`:(gl.rainProb>=40?` · ${gl.rainProb}% rain`:'')}${gl.loc?' · '+esc(gl.loc):''}</div></div>
      <span class="muted">Lawn →</span></div></div>` : '';
  const cLawn = cLawnCard();
  const cWeek = `<div class="card" style="cursor:pointer" onclick="goSub('train','history')"><div class="row">
      <div>${kicker('This week')}<div style="font-weight:700;margin-top:4px">${weekTally()}</div></div><span class="muted">Review →</span></div></div>`;

  const cw = weeklyCardio(), cardioPct = Math.min(100, Math.round(cw.min/CARDIO_GOAL*100));
  const cCardio = `<div class="card" style="cursor:pointer" onclick="goSub('train','cardio')">
      <div class="row"><div>${kicker('Cardio this week')}<div style="font-weight:700;margin-top:4px">${Math.round(cw.min)} / ${CARDIO_GOAL} min${cw.km>0?` · ${fmtDist(cw.km)}`:''}</div></div><span class="muted">Log →</span></div>
      <div style="height:6px;background:var(--surface-3);border-radius:4px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${cardioPct}%;background:var(--cardio-bar);border-radius:4px"></div></div>
    </div>`;

  const mobIso = todayISO(), mobOpen = accOpen.has('mob-today'), streak = mobStreak();
  const sDone = STRETCH_ITEMS.filter(x=>mobToday()[x.n]).length, complete = dayComplete(mobIso), sess = hasMobSession(mobIso);
  const actWk = weeklyActivationDays();
  const mobStatus = complete ? (sess ? 'Done ✓ — yoga/session' : 'Done ✓') : `Stretches ${sDone}/${STRETCH_ITEMS.length}`;
  const cMobility = `<div class="card">
      <div class="row" style="cursor:pointer" onclick="toggleAcc('mob-today')">
        <div>${kicker('Core & mobility — pelvic tilt')}
          <div style="font-weight:700;margin-top:4px">${mobStatus}${streak?` · 🔥 ${streak}-day streak`:''}</div>
          <div class="muted" style="font-size:11px;margin-top:2px">Activation ${actWk}× this week — aim 3–4</div>
        </div>
        <span class="muted">${ph(mobOpen?'caret-up':'caret-down')}</span>
      </div>
      ${mobOpen?`<div style="margin-top:10px">
        <button class="btn ${sess?'':'btn-ghost'} btn-block" onclick="toggleMobSession()">${sess?`${ph('check')}Yoga / full session logged — tap to undo`:`${ph('check')}Did yoga or a full mobility session`}</button>
        ${mobilityRows()}
      </div>`:`<p class="muted" style="margin-top:8px;font-size:12px">${complete?'Logged for today — nice.':'Stretch daily to fix the tilt — tap to check off.'}</p>`}
    </div>`;

  const todos = liveTodos();
  const TODO_CAP = 5, todosExpanded = accOpen.has('todos-all');
  const shownTodos = todosExpanded ? todos : todos.slice(0, TODO_CAP);
  const cTodo = `<div class="card">
      ${kicker('To-do'+(todos.length?` · ${todos.length} open`:''))}
      <div class="row" style="gap:8px;margin:8px 0 ${todos.length?'10px':'0'}">
        <input id="todo-input" placeholder="Add a task…" style="flex:1" onkeydown="if(event.key==='Enter')addTodo()">
        <button class="btn" onclick="addTodo()">Add</button>
      </div>
      ${shownTodos.map((t,i)=>{ const age=todoAge(t.created); return `<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-3)">
        <input type="checkbox" onchange="doneTodo(${i})" style="margin-top:1px">
        <span style="flex:1;font-size:14px">${esc(t.text)}${age>0?` <span class="muted" style="font-size:11px">· ${age}d</span>`:''}</span>
        <button class="x-set" onclick="removeTodo(${i})" title="remove">${ph('x')}</button>
      </div>`; }).join('')}
      ${todos.length>TODO_CAP?`<button class="addset" onclick="toggleAcc('todos-all')">${todosExpanded?'Show less':`+ ${todos.length-TODO_CAP} more`}</button>`:''}
      ${todos.length?'':'<p class="muted" style="margin-top:8px;font-size:12px">Nothing pending. Tasks roll over until you check them off — checking one logs it to your journal.</p>'}
    </div>`;

  const cQuota = quotaBannerShown ? `<div class="card" style="border:1.5px solid var(--danger-bd);background:rgba(255,107,107,.08)">
      <div style="font-weight:700;font-size:14px;color:var(--danger)">${ph('warning','lead')}This device is out of storage</div>
      <p class="muted" style="line-height:1.5;margin-top:4px">Recent changes may not be saved locally. Export a backup now, and make sure Cloud Sync is on so nothing is lost.</p>
      <div class="row" style="gap:8px;margin-top:10px"><button class="btn" style="flex:1" onclick="exportData()">${ph('download-simple')}Export now</button><button class="btn btn-ghost" style="flex:1" onclick="go('settings')">Settings</button></div>
    </div>` : '';
  const cBackup = backupStale() ? `<div class="card" style="border:1.5px solid var(--warm-bd);background:var(--warm-bg)">
      <div style="font-weight:700;font-size:14px">${ph('warning','lead')}Back up your data</div>
      <p class="muted" style="line-height:1.5;margin-top:4px">${SYNC && SYNC.user ? 'Cloud Sync is on, but keeping an occasional downloadable copy means even a bad sync can’t cost you anything.' : 'Your data lives only on this device. Turn on <strong>Cloud Sync</strong> and it\'s backed up automatically — and available on your laptop too. A one-off export works as a fallback.'}</p>
      <div class="row" style="gap:8px;margin-top:10px">${SYNC && SYNC.user ? '' : `<button class="btn" style="flex:1" onclick="go('settings')">${ph('cloud-arrow-up')}Set up sync</button>`}<button class="btn ${SYNC&&SYNC.user?'':'btn-ghost'}" style="flex:1" onclick="exportData()">${ph('download-simple')}Export</button></div>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="snoozeBackup()">Later</button>
    </div>` : '';

  const wDays = daysUntil(WEDDING_DATE);
  const cWedding = wDays===null ? '' : `<div class="card" style="text-align:center;background:var(--accent-muted);border:1px solid rgba(145,132,217,.4);box-shadow:0 0 24px rgba(145,132,217,.14)">
      <div style="font-weight:800;font-size:19px;color:var(--accent);letter-spacing:-.3px">💍 ${wDays===0?'It’s the big day! 🎉':wDays===1?'1 day to go!':`${wDays} days to go`}</div>
      <div class="muted" style="font-size:12px;margin-top:2px;font-family:var(--font-mono)">WEDDING · AUGUST 21, 2026</div>
    </div>`;

  let order;
  /* Weighing in is the first thing that happens in the morning — both of them, on the same scale —
     so until it's logged the card leads the page. Once both are in it drops to the bottom: done,
     out of the way. */
  if(part==='morning') order = weighedIn
    ? [cWeather, cLawn, cWorkout, cTodo, cMobility, cDo, cCardio, cJournal, cWeighIn]
    : [cWeighIn, cWeather, cLawn, cWorkout, cTodo, cMobility, cDo, cCardio, cJournal];
  else if(part==='afternoon') order=[cWorkout, cTodo, cDo, cMobility, cLawn, cCardio, cWeather, cWeighIn, cJournal];
  else order=[cJournal, cTodo, cMobility, cWeek, cLawn, cDo, cCardio, cWorkout, cWeighIn];

  /* Glance line — the day's answer at a glance: what routine, will it rain, what's still open.
     The workout segment follows the card: silent on a rest day rather than announcing a session
     the screen isn't offering. */
  const glanceWorkout = DB.draft
    ? `<span class="pill ${accClass(PROGRAM[DB.draft.workout]?PROGRAM[DB.draft.workout].group:'push')}" style="font-size:9px;padding:2px 7px">${DB.draft.workout}</span> in progress`
    : !isWorkoutDay ? `rest day`
    : nxtIsSpecialized ? `<span style="color:var(--accent-300);font-weight:600">Specialized</span> — pick a focus`
    : `<span class="pill ${accClass(g)}" style="font-size:9px;padding:2px 7px">${nxt}</span> today`;
  const glanceTodos = (n => n ? `<span style="color:var(--accent-300);font-weight:600">${n}</span> to-do${n!==1?'s':''} open` : `to-dos clear`)(liveTodos().length);
  /* Rain segment only when a forecast actually exists — "no rain expected" with no data would lie. */
  const glanceRain = gl ? `<span style="color:var(--muted-3)">·</span>${rainAt?`<span style="color:var(--accent-300);font-weight:600">rain ${rainAt}</span>`:'no rain expected'}` : '';
  const glance = `<p class="muted" style="font-size:12px;font-family:var(--font-mono);margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${glanceWorkout}${glanceRain}<span style="color:var(--muted-3)">·</span>${glanceTodos}</p>`;
  return `${cWedding}
    <div style="margin-bottom:16px"><h1>${greeting}</h1><p class="subtitle">${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}${gl?` · ${gl.icon} ${gl.temp}°`:''}</p>${glance}</div>
    ${cQuota}${cBackup}
    ${order.filter(Boolean).join('\n    ')}`;
}

/* ───────────────────────── WORKOUT — picker ───────────────────────── */
let previewOpen = null;  // workout name expanded on the picker (ephemeral UI)
function togglePreview(name){ previewOpen = previewOpen===name ? null : name; render(); }
/* What a day holds, without committing to it — starting a workout stamps startedAt immediately,
   so previewing had meant starting and cancelling. Shows the exercise you'd land on (the same
   last-time-or-first-example rule startWorkout uses), its rep range, and how it last went. */
function previewRows(name){
  return PROGRAM[name].slots.map((s,i)=>{
    const ref = lastRealEntry(name,i);
    const exName = ref ? ref.entry.name : s.examples[0];
    const rng = effRange(s, exName);
    const real = ref ? ref.entry.sets.filter(x=>!x.skipped && x.r!=='') : [];
    const lastStr = real.length ? real.map(x=>fmtSet(x.w,x.r)).join(', ') : '';
    return `<div style="padding:8px 0;border-top:1px solid var(--border-3)">
      <div class="row" style="gap:10px;align-items:flex-start">
        <div style="min-width:0">
          <div style="font-weight:600;font-size:13px">${esc(exName)}</div>
          <div class="muted" style="font-size:11px;margin-top:2px">${esc(s.muscle)} · ${esc(s.movement)}${s.note?' · '+esc(s.note):''}</div>
        </div>
        <span class="muted" style="white-space:nowrap;font-size:12px">${s.sets}×${rng.lo}${rng.hi!==rng.lo?'–'+rng.hi:''}</span>
      </div>
      ${lastStr?`<div class="muted" style="font-size:11px;margin-top:3px">Last: ${lastStr}${ref?' · '+fmtDate(ref.date):''}</div>`:''}
    </div>`;
  }).join('');
}
function viewPicker(){
  const nxt = nextWorkout();
  const card = (name, label, startBtn, skipName) => {
    const open = previewOpen===name; const ls = lastSessionOf(name);
    return `<div class="card" style="padding:14px">
      <div class="row">
        <div style="cursor:pointer;min-width:0" onclick="togglePreview('${name}')">
          <span class="pill ${accClass(PROGRAM[name].group)}">${label}</span>
          <div class="muted" style="margin-top:6px">${PROGRAM[name].slots.length} exercises${ls?' · last '+fmtDate(ls.date):''} ${ph(open?'caret-up':'caret-down')}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-ghost" onclick="skipDay('${skipName}')">Skip</button>
          ${startBtn}
        </div>

      ${open?`<div style="margin-top:10px">${previewRows(name)}</div>`:''}

  };
  const cards = SEQUENCE.map(name=>
    card(name, name, `<button class="btn btn-sm ${name===nxt?'':'btn-ghost'}" onclick="startWorkout('${name}')">${name===nxt?'Start ▶':'Start'}</button>`, name)
  ).join('');
  const is4Day = DB.routineMode==='4day';
  const specializedSection = is4Day ? `<h2 style="margin-top:22px">Specialized — choose one${nxt==='SPECIALIZED'?' <span class="flag">suggested next</span>':''}</h2>
    ${SPECIALIZED_OPTIONS.map(o=>
      card(o.name, o.label, `<button class="btn btn-sm btn-ghost" onclick="startWorkout('${o.name}')">Start</button>`, 'SPECIALIZED')
    ).join('')}
    <p class="muted" style="font-size:12px">Tip: avoid Back the week it lands right after a Pull day — little recovery.</p>` : '';
  const nxtLabel = nxt==='SPECIALIZED' ? 'Specialized (choose your focus)' : nxt;
  const guideDisplay = GUIDE.map((s,i)=> i===0 && is4Day ? {t:s.t, b:`<p><strong>Push / Pull / Legs</strong>, 4 days a week — 3 fixed days plus a <strong>4th specialized day</strong> you pick fresh each time (Chest & Triceps, Back, Shoulders, Biceps, or Legs) based on what's lagging. Recommended order: <strong>Push → Legs → Pull → Specialized</strong> (gives the upper body more recovery — avoid picking Back the week it lands right after Pull).</p><p>The 3 fixed days still run on a <strong>2-week cycle</strong> — week 1 uses version 1, week 2 uses version 2. The app rotates you through this automatically and suggests your next session.</p>`} : s);
  return `<h1>Pick a workout</h1><p class="subtitle">Suggested next: <strong>${nxtLabel}</strong></p>
    <div style="margin-top:16px">${cards}</div>
    ${specializedSection}
    <h2 style="margin-top:22px">${ph('book-open')}How this program works</h2>
    ${guideDisplay.map((s,i)=>{ const o=guideOpen.has(i); return `<div class="phase-card">
      <button class="phase-header" onclick="toggleGuide(${i})"><span class="phase-title" style="font-size:14px">${s.t}</span><span style="color:var(--muted-2);display:inline-block;transform:rotate(${o?180:0}deg);transition:.2s">${ph('caret-down')}</span></button>
      ${o?`<div class="phase-body">${s.b}</div>`:''}
    </div>`; }).join('')}`;
}

function startWorkout(name){
  if(DB.draft && DB.draft.workout!==name){
    if(!confirm(`You have an unfinished ${DB.draft.workout}. Discard it and start ${name}?`)) return;
  }
  if(!DB.draft || DB.draft.workout!==name){
    collapsedEx.clear();
    DB.draft = { workout:name, date:todayISO(), startedAt:Date.now(),
      entries: PROGRAM[name].slots.map((s,i)=>{
        const ref = lastRealEntry(name,i);
        const exName = ref? ref.entry.name : s.examples[0];
        const aw = addWeightInfo(s, ref, exName);
        const real = ref? ref.entry.sets.filter(x=>!x.skipped && x.r!=='') : [];
        return { name: exName, note:'', sets: Array.from({length:s.sets},(_,k)=>{
          let w='';
          if(aw) w = (aw.allTop && aw.hasLoad) ? String(aw.newW) : (real[k]? real[k].w : (real.length? real[real.length-1].w : ''));
          return { w, r:'', skipped:false, reason:'' };
        }) };
      }),
      stairs: { level:'', seconds:'', skipped:false, reason:'' },
      extras: blankExtras(name), sessionNote:''
    };
    const ls = lastRealStairs();
    if(ls){ DB.draft.stairs.seconds = String((+ls.st.seconds)+15); DB.draft.stairs.level = String(ls.st.level||''); }
    save();
  }
  goSub('train','log');
}
function skipDay(name){
  const reason = prompt(`Skip ${name} entirely? Add a reason (optional):`, '');
  if(reason===null) return;
  DB.sessions.push(touch({ id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), workout:name, date:todayISO(), skipped:true, reason:reason.trim(), entries:[], stairs:null, durationMin:null }));
  sortSessions(); save(); toast(`${name} skipped`);
  go('today');
}
function startBackdate(name){
  if(DB.draft && !confirm(`You have an unfinished ${DB.draft.workout}. Discard it?`)) return;
  collapsedEx.clear();
  DB.draft = { workout:name, date:todayISO(), historical:true, startedAt:null, durationMin:'',
    entries: PROGRAM[name].slots.map((s,i)=>{ const ref=lastRealEntry(name,i); return { name: ref?ref.entry.name:s.examples[0], note:'', sets: Array.from({length:s.sets},()=>({w:'',r:'',skipped:false,reason:''})) }; }),
    stairs:{ level:'', seconds:'', skipped:false, reason:'' }, extras: blankExtras(name), sessionNote:'' };
  const ls=lastRealStairs(); if(ls){ DB.draft.stairs.seconds=String((+ls.st.seconds)+15); DB.draft.stairs.level=String(ls.st.level||''); }
  showBackdate=false; save();
  goSub('train','log');
}

/* ───────────────────────── WORKOUT — active session ───────────────────────── */
function viewActive(){
  const name = DB.draft.workout, g = PROGRAM[name].group;
  const slots = PROGRAM[name].slots;
  const cards = slots.map((s,i)=>{
    const entry = DB.draft.entries[i];
    if(collapsedEx.has(i)){ // collapsed to a one-line summary to cut scrolling
      const done = entry.sets.filter(x=>!x.skipped && x.r!=='');
      const summary = done.length ? done.map(x=>fmtSet(x.w,x.r)).join(', ') : 'no sets yet';
      return `<div class="ex-card"><div class="ex-accent ${barClass(g)}"></div>
        <div class="ex-body" style="padding:11px 14px;cursor:pointer" onclick="toggleExCollapse(${i})">
          <div class="row"><div style="min-width:0"><span style="font-weight:700;font-size:14px">${esc(entry.name)}</span> <span class="muted" style="font-size:12px">${done.length?'✓ ':''}${summary}</span></div><span class="muted" style="white-space:nowrap">▾ expand</span></div>
        </div></div>`;
    }
    /* "Last time" tracks the exercise actually selected, not just this slot's position — swap
       Barbell bench → DB bench and the barbell numbers must not follow you. Exact match in this
       slot first; failing that, the last time you did this exercise anywhere, clearly labelled as
       coming from elsewhere. Only an exact match earns the ⬆ Add weight flag and the ✓/= badges. */
    const ref = lastRealEntry(name, i, entry.name);
    const alt = ref ? null : lastAnywhere(entry.name);
    const rng = effRange(s, entry.name);
    const real = ref ? ref.entry.sets.filter(x=>!x.skipped && x.r!=='') : [];
    let lastLine = `<span class="muted">No previous data — set your baseline.</span>`, flag='', noteHint='';
    if(ref){
      lastLine = `Last time (${fmtDate(ref.date)}): <strong>${real.map(x=> fmtSet(x.w,x.r)).join(',  ')||'—'}</strong>`;
      const aw = addWeightInfo(s, ref, entry.name);
      flag = (aw && aw.allTop) ? `<span class="flag">⬆ Add weight${aw.hasLoad?` → ${aw.newW} ${DB.unit}`:''}</span>` : '';
      if(ref.entry.note) noteHint = `<div class="last-note">📝 Last note: ${esc(ref.entry.note)}</div>`;
    } else if(alt){
      const altReal = alt.entry.sets.filter(x=>!x.skipped && x.r!=='');
      lastLine = `Last time (${fmtDate(alt.date)} · ${esc(alt.workout)}): <strong>${altReal.map(x=> fmtSet(x.w,x.r)).join(',  ')||'—'}</strong>`;
      /* Only translate when those reps sit outside this slot's range — that's the case where the
         old load doesn't transfer. Same-range history speaks for itself. Display only, never
         pre-filled: a suggestion shouldn't quietly become a logged number. */
      const best = altReal.reduce((a,x)=> e1rm(x.w,x.r) > e1rm(a.w,a.r) ? x : a, altReal[0]);
      const offRange = best && (+best.r < rng.lo || +best.r > rng.hi);
      const sug = offRange ? translateLoad(best.w, best.r, rng.lo) : null;
      if(sug) lastLine += ` <span class="muted">→ suggest <strong>${sug} ${DB.unit}</strong> for ${rng.lo}${rng.hi!==rng.lo?'–'+rng.hi:''}</span>`;
      if(alt.entry.note) noteHint = `<div class="last-note">📝 Last note: ${esc(alt.entry.note)}</div>`;
    }
    let coachHint='';
    if(entry.deload) coachHint = `<div class="coach deload">↓ Deloaded −10% this session — rebuild from here. <button class="coach-btn" onclick="undeloadExercise(${i})">undo</button></div>`;
    else if(isStalledSlot(entry.name, name, i)) coachHint = `<div class="coach stall">⚠ Stalled — no new best for this exercise on ${name} in 3 sessions. <button class="coach-btn" onclick="deloadExercise(${i})">Deload −10%</button> or swap the exercise above.</div>`;
    const opts = s.examples.map(e=>`<option ${e===entry.name?'selected':''}>${esc(e)}</option>`).join('') +
                 (s.examples.includes(entry.name)?'':`<option selected>${esc(entry.name)}</option>`) +
                 `<option value="__custom">+ Custom…</option>`;
    const setRows = entry.sets.map((st,k)=>{
      if(st.skipped) return `<div class="skip-note"><span>${ph('skip-forward','lead')}Set ${k+1} skipped${st.reason?': <em>'+esc(st.reason)+'</em>':''}</span><button onclick="unskipSet(${i},${k})">Undo</button></div>`;
      const [bt,bc,btitle] = setStatus(i,k);
      return `<div class="set-grid">
        <span class="set-no">${k+1}</span>
        <input type="number" inputmode="decimal" id="w-${i}-${k}" placeholder="0=BW" value="${st.w}" oninput="setVal(${i},${k},'w',this.value);updTargetBadge(${i},${k});updPlates(${i})" onchange="rollWeight(${i},${k},this.value)">
        <input type="number" inputmode="numeric" id="r-${i}-${k}" placeholder="${repHint(i,k)}" value="${st.r}" oninput="setVal(${i},${k},'r',this.value);updTargetBadge(${i},${k})" onchange="repCheck(${i},${k})">
        <span id="tgt-${i}-${k}" class="tgt-badge ${bc}" title="${esc(btitle||'')}">${bt}</span>
        <button class="skip-set" onclick="skipSet(${i},${k})" title="skip this set">${ph('skip-forward')}</button>
        <button class="x-set" onclick="rmSet(${i},${k})" title="remove set">${ph('x')}</button>
      </div>`;
    }).join('');
    return `<div class="ex-card">
      <div class="ex-accent ${barClass(g)}"></div>
      <div class="ex-body">
        <div class="ex-head">
          <div><div class="ex-meta">${s.muscle} · ${s.movement}${s.note?' · '+s.note:''} · <a href="${gsearch(entry.name)}" target="_blank" rel="noopener" style="color:var(--link);font-weight:600">how-to ${ph('arrow-square-out')}</a></div></div>
          <div style="text-align:right;white-space:nowrap">

  const lblCss = 'font-size:10px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px';

function setDraftDate(v){ DB.draft.date=v; save(); }
function setDraftDur(v){ DB.draft.durationMin=v; save(); }

function pickEx(i, sel){
  if(sel.value==='__custom'){ const v=prompt('Exercise name:', DB.draft.entries[i].name); if(v){DB.draft.entries[i].name=v.trim();} save(); render(); return; }

function setVal(i,k,f,v){ DB.draft.entries[i].sets[k][f]=v; if(f==='r' && v!=='') restCtx=restTargetForSlot(i); save(); /* live save, no re-render to keep focus */ }

/* Roll the WEIGHT down into still-empty sets below. Fired on `change` (after the full

function rollWeight(i,k,value){
  const sets=DB.draft.entries[i].sets;
  sets[k].w=value;
  if(value!==''){
    for(let j=k+1;j<sets.length;j++){
      if(sets[j].skipped) continue;
      if(sets[j].w===''){ sets[j].w=value; const el=document.getElementById(`w-${i}-${j}`); if(el) el.value=value; }
    }

}
function addSet(i){ DB.draft.entries[i].sets.push({w:'',r:'',skipped:false,reason:''}); save(); render(); }
function rmSet(i,k){ if(DB.draft.entries[i].sets.length<=1)return; DB.draft.entries[i].sets.splice(k,1); save(); render(); }
function skipSet(i,k){
  const reason = prompt(`Why skipping set ${k+1}? (optional)`, '');
  if(reason===null) return;
  const st = DB.draft.entries[i].sets[k]; st.skipped=true; st.reason=reason.trim(); st.w=''; st.r='';
  save(); render();
}
function unskipSet(i,k){ const st=DB.draft.entries[i].sets[k]; st.skipped=false; st.reason=''; save(); render(); }
function stairVal(f,v){ DB.draft.stairs[f]=v; save(); }
function stairTimeSet(part,v){
  const cur=+(DB.draft.stairs.seconds||0); let m=Math.floor(cur/60), s=cur%60;
  if(part==='m') m=Math.max(0,parseInt(v)||0); else s=Math.max(0,parseInt(v)||0);
  DB.draft.stairs.seconds=String(m*60+s); save();
}
/* Fire confetti when a set reaches the top of its rep range (the "level up" signal). */
function repCheck(i,k){
  const set=DB.draft.entries[i].sets[k]; if(set.skipped) return;
  const rng=effRange(PROGRAM[DB.draft.workout].slots[i], DB.draft.entries[i].name);
  if(set.r!==''){ restCtx=restTargetFor(rng.hi); sw.acc=0; sw.start=Date.now(); sw.running=true; updateStopwatch(); } // committing a set starts the rest clock for that exercise
  if(set.r!=='' && +set.r>=rng.hi){ if(!set._cel){ set._cel=true; save(); confettiBurst(); toast('💥 Top of the range!'); } }
  else if(set._cel){ set._cel=false; save(); }
}
function confettiBurst(){
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d'), dpr=window.devicePixelRatio||1;
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const colors=['#e08a2e','#44a884','#9184d9','#9a7ed0','#e0c14e','#e0567a'];
  const parts=[];
  for(let i=0;i<100;i++) parts.push({ x:innerWidth/2, y:innerHeight*0.30, vx:(Math.random()-0.5)*11, vy:Math.random()*-10-3, g:0.28+Math.random()*0.12, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.4, size:5+Math.random()*6, color:colors[i%colors.length], life:1 });
  let t=0;
  (function frame(){ t++; ctx.clearRect(0,0,innerWidth,innerHeight); let alive=false;
    parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=0.011;
      if(p.life>0 && p.y<innerHeight+30){ alive=true; ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore(); } });
    if(alive && t<220) requestAnimationFrame(frame); else canvas.remove();
  })();
}
function skipStairs(){ const reason=prompt('Why skipping the stair stepper? (optional)',''); if(reason===null)return; DB.draft.stairs.skipped=true; DB.draft.stairs.reason=reason.trim(); save(); render(); }
function unskipStairs(){ DB.draft.stairs.skipped=false; DB.draft.stairs.reason=''; save(); render(); }
function toggleWarm(i){
  const box = document.getElementById('warm-'+i); box.classList.toggle('hidden');
  if(box.classList.contains('hidden')) return;
  const entry = DB.draft.entries[i], sets = entry.sets;
  const w = Math.max(...sets.map(s=> +s.w || 0), 0);
  if(!w){ box.innerHTML = `<div><span>Enter a working weight first</span></div>`; return; }
  /* Loading the bar is exactly when you want the plate breakdown, so each rung carries its own.
     Non-barbell lifts (and kg) fall through to the plain percentages. */
  const bar = barWeight(entry.name);
  const plates = t => { const s = bar==null ? '' : platesText(t, bar); return s ? `<div class="warm-plates">${s}</div>` : ''; };
  const rung = (label, target, reps) => `<div><span>${label}${plates(target)}</span><span>${reps}</span></div>`;
  const w50 = round5(w*0.5), w75 = round5(w*0.75);

  const first = bar > 0 ? `<div><span>Empty bar — ${bar} ${DB.unit}</span><span>a few reps</span></div>`
              : bar === 0 ? `<div><span>Empty sled — no plates</span><span>a few reps</span></div>`
              : `<div><span>Bodyweight — no load</span><span>5–10 reps</span></div>`;
  box.innerHTML = `
    ${first}
    ${rung(`~50% — ${w50} ${DB.unit}`, w50, '3–4 reps')}
    ${rung(`~75% — ${w75} ${DB.unit}`, w75, '2–3 reps')}
    ${rung(`<strong>Working — ${w} ${DB.unit}</strong>`, w, 'per plan')}

}
function finishWorkout(){
  const d = DB.draft;
  // A set counts as WORKED iff reps are entered (pre-filled weight alone is not data).
  const hasEx = d.entries.some(e=> e.sets.some(s=> s.skipped || s.r!==''));
  const hasStairs = d.stairs && (d.stairs.skipped || d.stairs.seconds!=='');
  const x = d.extras || {};
  const hasExtra = Object.keys(x).some(w=> x[w].sets.some(s=> s.r!==''));
  if(!hasEx && !hasStairs && !hasExtra){ alert('Log at least one set (with reps) before saving.'); return; }
  // keep skipped sets (they carry a reason); drop sets with no reps (incl. pre-filled-weight-only)
  d.entries.forEach(e=>{ e.sets = e.sets.filter(s=> s.skipped || s.r!==''); e.sets.forEach(s=>delete s._cel); });
  Object.keys(x).forEach(w=>{ x[w].sets = x[w].sets.filter(s=> s.r!==''); });
  const endedAt = Date.now(), hist = d.historical;
  const prior = hist ? {} : Object.fromEntries(exercisePRs().map(p=>[p.name,p.v]));
  const sess = {
    id: d.editRef || ('w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),
    workout:d.workout, date:d.date,
    startedAt: hist ? null : (d.startedAt||null),
    endedAt: hist ? null : endedAt,
    durationMin: hist ? (d.durationMin? +d.durationMin : null)
                      : (d.startedAt ? Math.max(1, Math.round((endedAt-d.startedAt)/60000)) : null),
    entries:d.entries, stairs:d.stairs, extras:x, note:(d.sessionNote||'').trim()
  };
  if(d.editRef) DB.sessions = DB.sessions.filter(z=> z.id!==d.editRef); // editing → drop the original before re-inserting
  // PR detection: an exercise whose heaviest set this session beats its prior all-time heaviest.
  // Only drives the save-time toast — everything on screen re-derives PRs from prSetIndex().
  let prs=[];
  if(!hist){
    const rngs=sessionRanges(sess);
    sessionExercises(sess).forEach(e=>{ let best=0; const rng=rngs.get(e);
      e.sets.forEach(z=>{ if(!z.skipped && z.r!=='' && prEligible(rng,z)){ const v=setLoad(z); if(v>best) best=v; } });
      if(best>0 && best>(prior[e.name]||0)) prs.push({name:e.name, v:best, prev:prior[e.name]||0}); });
    if(prs.length) sess.prs = prs.map(p=>p.name);
  }
  DB.sessions.push(touch(sess));
  sortSessions();
  DB.draft = null; collapsedEx.clear(); save(); snapshotNow('after-workout'); cloudVersion('workout');
  if(prs.length){ confettiBurst(); toast(prs.length===1 ? `🏆 PR! ${prs[0].name} ${prs[0].prev||'—'}→${prs[0].v} ${DB.unit}` : `🏆 ${prs.length} PRs this session!`); }
  else toast(hist?'Past workout added':'Workout saved 💪');
  goSub('train','history');
}
function sortSessions(){ DB.sessions.sort((a,b)=> a.date===b.date ? ((a.endedAt||0)-(b.endedAt||0)) : a.date.localeCompare(b.date)); }

/* Week in review — merges logged workouts/hobbies/weigh-ins with the daily journal note. */
function renderWeekReview(){

  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today = todayISO();

    const dt = new Date(base); dt.setDate(dt.getDate()+di);

    if(dayComplete(iso)) tags.push(`<span style="font-size:11px">🧎 ${hasMobSession(iso)?'session':mobDoneOn(iso)}</span>`);
    if(sess.some(s=>prIdx.sessionHasPR(s))) tags.push(`<span style="font-size:11px">🏆 PR</span>`);

    const editLink = iso => `<a onclick="editJournal('${iso}')" style="color:var(--link);cursor:pointer;font-size:12px;font-weight:600">${ph('note-pencil')}${hasNote?'Edit note':'Add note'}</a>`;
    let noteHTML;

    else if(editJournalDate===iso){
      noteHTML = `<div style="margin-top:6px">
        <textarea id="journal-edit-${iso}" rows="3" placeholder="What did you do on this day?" oninput="saveJournalFor('${iso}',this.value)" style="resize:vertical;line-height:1.5;min-height:64px;font-size:13px">${esc(note||'')}</textarea>
        <button class="btn btn-sm" style="margin-top:6px" onclick="closeJournalEdit()">Done</button>

        <div style="margin-top:${hasNote?4:3}px">${editLink(iso)}${addActivityDate===iso?'':` <span style="color:var(--muted-3)">·</span> <a onclick="openActivityAdd('${iso}')" style="color:var(--link);cursor:pointer;font-size:12px;font-weight:600">＋ Log activity</a>`}</div>`;

        <div class="row" style="gap:8px"><select id="act-item" style="flex:1">${items.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="btn btn-sm" onclick="addActivityFor('${iso}')">Add</button><button class="btn btn-sm btn-ghost" onclick="cancelActivityAdd()">Done</button></div>
        ${dayActs.length?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${dayActs.map(o=>`<span style="font-size:11px;background:var(--surface-3);border-radius:12px;padding:3px 9px">🎲 ${esc(o.h.item||o.h.hobby)} <span onclick="removeActivity(${o.idx})" style="cursor:pointer;color:var(--danger);font-weight:700;margin-left:2px">×</span></span>`).join('')}</div>`:''}

      <span style="font-weight:700;font-size:13px">${dn} ${dt.getMonth()+1}/${dt.getDate()}${iso===today?' · today':''}</span>
      ${tags.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:5px">${tags.join('')}</div>`:''}

function toggleBackdate(){ showBackdate=!showBackdate; render(); }
function fmtSeconds(t){ if(!t) return '0s'; const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60; if(h) return `${h}h ${m}m`; if(m) return `${m}m${s?' '+s+'s':''}`; return `${s}s`; }
function monday(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function renderSummary(){

    <div class="stat-grid3">

}

/* Re-open a past workout into the editor to fix exercises/sets (e.g. logged the wrong day).
   Re-saving replaces the original (matched by stable id); discarding leaves it untouched. */
function editSession(idx){
  const s=DB.sessions[idx]; if(!s || s.skipped) return;
  if(!PROGRAM[s.workout]){ toast('Can’t edit — unknown workout type'); return; }
  if(DB.draft && !confirm('You have an unfinished workout. Discard it to edit this one?')) return;
  if(!s.id) s.id='w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  collapsedEx.clear();
  DB.draft = {
    workout:s.workout, date:s.date, historical:true, startedAt:null, durationMin:(s.durationMin||''),
    editRef: s.id,
    entries: PROGRAM[s.workout].slots.map((sl,i)=>{ const e=(s.entries||[])[i];
      return e ? { name:e.name, note:e.note||'', deload:!!e.deload, sets:(e.sets||[]).map(x=>({w:x.w,r:x.r,skipped:!!x.skipped,reason:x.reason||''})) }
               : { name:sl.examples[0], note:'', sets:[] }; }),
    stairs: s.stairs ? { level:s.stairs.level, seconds:s.stairs.seconds, skipped:!!s.stairs.skipped, reason:s.stairs.reason||'' } : { level:'', seconds:'', skipped:false, reason:'' },
    extras: s.extras ? JSON.parse(JSON.stringify(s.extras)) : blankExtras(s.workout),
    sessionNote: s.note || ''
  };
  save(); openHist=-1; toast('Editing — re-save to update this entry'); goSub('train','log');
}

/* Every logged session of one exercise, newest first — the "past data" behind the chart.

function exerciseHistory(name){

      let best=0, reps=0; worked.forEach(x=>{ const v=e1rm(x.w,x.r); if(v>best) best=v; reps+=+x.r; });
      out.push({ date:s.date, setsStr:worked.map(x=>fmtSet(x.w,x.r)).join(', '), best:Math.round(best), reps, deload:!!e.deload, note:e.note||'' });
    });
  }

}

/* Weekly cardio minutes (cardio log + stair-stepper finishers) for the last n weeks, oldest → newest. */
function cardioWeeks(n){
  const base=monday(new Date()), out=[];
  for(let i=n-1;i>=0;i--){ const ws=new Date(base); ws.setDate(ws.getDate()-i*7); const wsTs=+ws; let min=0,km=0;
    liveCardio().forEach(c=>{ if(+monday(new Date(c.date+'T00:00'))===wsTs){ min+=(+c.minutes||0); km+=(+c.distanceKm||0); } });
    liveSessions().forEach(s=>{ const st=s.stairs; if(!s.skipped && st && !st.skipped && st.seconds!=='' && st.seconds!=null && +monday(new Date(s.date+'T00:00'))===wsTs) min+=(+st.seconds||0)/60; });
    out.push({ start:ws, min:Math.round(min), km }); }
  return out;
}
function viewCardioTrend(sub){
  const weeks=cardioWeeks(8);
  if(!weeks.some(w=>w.min>0) && !liveCardio().length)
    return `<h1>Progress</h1><p class="subtitle">Cardio minutes per week</p>${sub}<div class="empty">Log cardio (or a stair-stepper finisher) and your weekly trend shows up here.</div>`;
  const maxV=Math.max(CARDIO_GOAL, ...weeks.map(w=>w.min));
  const bars=weeks.map(w=>{ const h=Math.max(2,Math.round(w.min/maxV*100)), hit=w.min>=CARDIO_GOAL;

  const ws = (rows || liveWeights()).slice().sort((a,b)=>a.date.localeCompare(b.date));
  return ws.map(w=>{
    const end=new Date(w.date+'T00:00'), start=new Date(end); start.setDate(start.getDate()-6);
    const win=ws.filter(x=>{ const d=new Date(x.date+'T00:00'); return d>=start && d<=end; });

/* trend (optional): a parallel series (same length as pts) drawn as the bold primary line, with
   pts shown as faint dots + a hairline. Used for the running-best strength trend. */
function paintChart(svg, pts, emptyMsg, gradId, trend, colorVar){
  /* colorVar: optional CSS var name so each Progress metric gets its own hue
     (weight = --chart blurple, strength = --chart-strength teal). */
  const cs = getComputedStyle(document.documentElement);
  const C = cs.getPropertyValue(colorVar || '--chart').trim() || '#9184d9';
  const AX = cs.getPropertyValue('--chart-axis').trim() || '#4a4d5e';
  if(pts.length<2){ svg.innerHTML = `<text x="160" y="78" text-anchor="middle" fill="${AX}" font-size="11">${emptyMsg||'Need 2+ entries to draw a trend'}</text>`; return; }
  const vals = pts.map(p=>+p.value).concat(trend?trend.map(p=>+p.value):[]);
  const min=Math.min(...vals), max=Math.max(...vals);
  const pad = (max-min)*0.15 || 1, lo=min-pad, hi=max+pad;
  const W=320,H=150,mL=4,mR=4,mT=12,mB=14;
  const x = i => mL + i*(W-mL-mR)/(pts.length-1);
  const y = v => mT + (1-(v-lo)/(hi-lo))*(H-mT-mB);
  const pathOf = arr => arr.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(+p.value).toFixed(1)}`).join(' ');
  const areaOf = arr => `M${x(0)},${H-mB} `+arr.map((p,i)=>`L${x(i).toFixed(1)},${y(+p.value).toFixed(1)}`).join(' ')+` L${x(arr.length-1)},${H-mB} Z`;
  const gid = gradId||'g';
  const defs = `<defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${C}" stop-opacity="0.18"/><stop offset="1" stop-color="${C}" stop-opacity="0"/></linearGradient></defs>`;
  const axis = `<text x="${mL}" y="9" fill="${AX}" font-size="9">${hi.toFixed(0)}</text><text x="${mL}" y="${H-3}" fill="${AX}" font-size="9">${lo.toFixed(0)}</text>`;
  if(trend){
    const dots = pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(+p.value).toFixed(1)}" r="1.8" fill="${C}" opacity="0.5"/>`).join('');
    svg.innerHTML = `${defs}
      <path d="${areaOf(trend)}" fill="url(#${gid})"/>
      <path d="${pathOf(pts)}" fill="none" stroke="${C}" stroke-width="1" stroke-opacity="0.35" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <path d="${pathOf(trend)}" fill="none" stroke="${C}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      ${axis}`;
  } else {
    const dots = pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(+p.value).toFixed(1)}" r="2.5" fill="${C}"/>`).join('');
    svg.innerHTML = `${defs}
      <path d="${areaOf(pts)}" fill="url(#${gid})"/>
      <path d="${pathOf(pts)}" fill="none" stroke="${C}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${axis}`;
  }
}

function runningMax(pts){ let m=-Infinity; return pts.map(p=>{ m=Math.max(m,+p.value); return {date:p.date, value:m}; }); }

let weatherFetching=false;
function wxCode(c){ c=+c;
  if(c===0) return {icon:'☀️',text:'Clear'};
  if(c<=2) return {icon:'🌤️',text:'Mostly clear'};
  if(c===3) return {icon:'☁️',text:'Overcast'};
  if(c<=48) return {icon:'🌫️',text:'Fog'};
  if(c<=57) return {icon:'🌦️',text:'Drizzle'};
  if(c<=67) return {icon:'🌧️',text:'Rain'};
  if(c<=77) return {icon:'❄️',text:'Snow'};
  if(c<=82) return {icon:'🌦️',text:'Showers'};
  if(c<=86) return {icon:'❄️',text:'Snow showers'};
  return {icon:'⛈️',text:'Thunderstorm'};
}
async function fetchWeather(){
  if(!DB.lawn || DB.lawn.lat==null || weatherFetching) return;
  weatherFetching=true; render();
  try{
    const {lat,lon}=DB.lawn;
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,windspeed_10m_max&hourly=temperature_2m,precipitation&temperature_unit=fahrenheit&windspeed_unit=mph&precipitation_unit=inch&timezone=auto&past_days=3&forecast_days=7`;
    const r=await fetch(url); if(!r.ok) throw 0;
    /* saveLocal, NOT save(): the weather cache is derived data. Bumping updatedAt here is what let a
       4-day-stale device look "newest" merely by being opened, and then overwrite the cloud. */
    DB.wx={ at:Date.now(), lat, lon, data:await r.json() }; saveLocal();
  }catch(e){ /* keep last cached result */ }
  weatherFetching=false; render();
}
function maybeFetchWeather(){
  if(!DB.lawn || DB.lawn.lat==null || weatherFetching) return; // only called from the Care/Lawn onRender
  const wx=DB.wx, stale = !wx || (Date.now()-wx.at>3600000) || wx.lat!==DB.lawn.lat || wx.lon!==DB.lawn.lon;
  if(stale) fetchWeather();
}

async function geocodeTry(q){ try{ const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`); const d=await r.json(); return (d.results && d.results[0]) || null; }catch(e){ return null; } }
async function searchLocation(){

}
