/* ───────────────────────── Smart lawn scheduler ─────────────────────────
   Cool-season grass (St. Louis Park, MN) — hardcoded seasonal rules. Recommendations are
   weather-adaptive (Open-Meteo daily precip + hourly temps) with hard rules the user can
   override per day. Logging watered/mowed drives the "days since" recency checks. */
const SEASON_RULES = {
  spring: { months:[4,5],  waterPerWeek:2,   rainSkip:0.5, heatLimit:null, heatWater:null },
  summer: { months:[6,7,8],waterPerWeek:3.5, rainSkip:0.3, heatLimit:85,   heatWater:90 }, // 3–4×/week
  fall:   { months:[9,10], waterPerWeek:2,   rainSkip:0.5, heatLimit:null, heatWater:null },
};
/* heatLimit = don't MOW above this (hourly scan). heatWater = a forecast high at or above this
   tightens WATERING to every allowed day — cool-season grass is what's at risk in a 95°F stretch. */
/* Cool-season grass wants ~1" of water a week, so each session targets 1" ÷ sessions-per-week —
   and when heat tightens the interval, each session gets proportionally shorter, not longer.
   0.5"/hr is a typical oscillating sprinkler; the tuna-can tip in the UI is how you check yours. */
const LAWN_WEEK_INCHES = 1, SPRINKLER_IN_PER_HR = 0.5;
function waterSession(everyDays){
  const perWeek = 7 / Math.max(1, everyDays);
  const inches = LAWN_WEEK_INCHES / perWeek;
  return { inches, minutes: Math.max(5, Math.round(inches / SPRINKLER_IN_PER_HR * 60 / 5) * 5) };
}
function lawnSeason(date){ const m=date.getMonth()+1; for(const s in SEASON_RULES) if(SEASON_RULES[s].months.includes(m)) return s; return null; }
/* St. Louis Park sprinkling ordinance: odd-numbered addresses may sprinkle only on odd calendar
   days (even → even), and no sprinkling noon–6pm. Ian's address ends odd. Exemptions (new sod/seed,
   new plantings, flower gardens) aren't the established lawn — use the per-day override for those. */
const LAWN_ADDR_PARITY = 'odd';
const LAWN_HOURS_NOTE = 'before noon or after 6pm';
function dateParity(n){ return n%2===0 ? 'even' : 'odd'; }
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function nextSprinkleDate(){ const base=new Date(); for(let i=1;i<=2;i++){ const n=new Date(base); n.setDate(base.getDate()+i); if(dateParity(n.getDate())===LAWN_ADDR_PARITY) return n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); } return null; }
function dsFmt(n){ if(n===Infinity) return 'never'; if(n===0) return 'today'; return n+' day'+(n>1?'s':'')+' ago'; }
function dsWithDate(n){ if(n===Infinity) return 'never'; const d=new Date(); d.setDate(d.getDate()-n); return dsFmt(n)+' ('+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+')'; }
function fmtHour(h){ const ap=h>=12?'pm':'am'; let hh=h%12; if(hh===0) hh=12; return hh+ap; }
/* Days since the last date logged {key:true}. Infinity if never. */
function daysSinceLawn(key){ const log=DB.lawnLog||{}; const base=new Date(); base.setHours(0,0,0,0);
  for(let n=0;n<400;n++){ const d=new Date(base); d.setDate(d.getDate()-n); const iso=d.toLocaleDateString('en-CA'); if(log[iso] && log[iso][key]) return n; }
  return Infinity; }
/* Scan a day's 8am–8pm hourly temps for the heat limit. Defaults to today; the home card also asks
   about tomorrow and the mow forecast asks about all 7 — the hourly array spans the whole forecast. */
function lawnHeatWindow(limit, iso){
  if(limit==null) return {status:'none'};
  const h=DB.wx && DB.wx.data && DB.wx.data.hourly;
  if(!h || !h.time || !h.temperature_2m) return {status:'nowx'};
  const today=iso||todayISO(); let firstHot=null, any=false;
  for(let i=0;i<h.time.length;i++){ const t=h.time[i]; if(t.slice(0,10)!==today) continue; const hr=+t.slice(11,13); if(hr<8||hr>20) continue; any=true; if(+h.temperature_2m[i]>=limit && firstHot==null) firstHot=hr; }
  if(!any) return {status:'nowx'};
  if(firstHot==null) return {status:'none'};        // never reaches the limit in the window
  if(firstHot<=8) return {status:'allhot'};          // already hot when the window opens
  return {status:'before', hour:firstHot};
}
/* Rain across a day's 8am–9pm mow window, read from the HOURLY forecast — the same field the
   weather card's "rain ~1pm" line uses. The mow rule used to test only the daily roll-up (≥0.1" or
   ≥50% chance), so a day with 0.09" falling over two afternoon hours at 45% showed "rain ~1pm" on
   one card and "mow today" on the next. Same data, one answer now.
   `allwet` = rain before the window opens or a soaking day; `before` = dry morning, rain later. */
const MOW_RAIN_HOUR = 0.02, MOW_RAIN_DAY = 0.1, MOW_DRY_UNTIL = 10;
function lawnRainWindow(iso){
  const h=DB.wx && DB.wx.data && DB.wx.data.hourly;
  if(!h || !h.time || !h.precipitation) return {status:'nowx'};
  const day=iso||todayISO(); let firstWet=null, total=0, any=false;
  for(let i=0;i<h.time.length;i++){ const t=h.time[i]; if(t.slice(0,10)!==day) continue;
    const hr=+t.slice(11,13); if(hr<8||hr>21) continue; any=true;
    const p=+h.precipitation[i]||0; total+=p;
    if(p>=MOW_RAIN_HOUR && firstWet==null) firstWet=hr; }
  if(!any) return {status:'nowx'};
  if(firstWet==null) return {status:'none'};
  /* A soaking day is a write-off whenever it lands; a morning shower leaves the grass wet all day. */
  if(total>=MOW_RAIN_DAY || firstWet<MOW_DRY_UNTIL) return {status:'allwet', total};
  return {status:'before', hour:firstWet, total};
}
/* ── The mow decision, in ONE place ──────────────────────────────────────────────────────────
   Today's card, tomorrow's heads-up and the 7-day "expect to mow" forecast all call this, so they
   can never drift apart (the forecast promising a day the card then refuses is the obvious failure
   mode). Precedence is deliberate: too-soon beats wet beats heat beats not-yet-due. `nowx` heat
   means we couldn't check the temperature — assume safe, as everywhere else offline. */
function mowVerdict(o){
  const heat = o.heat || {status:'none'}, rain = o.rain || {status:'none'};
  const growthSpike = !!o.havewx && o.rain3 >= 0.5;      // ≥0.5" in 3 days → grass jumps, tighten to day 5
  const due = o.dsMow > 7 || (o.dsMow >= 5 && growthSpike);
  let blocked = null;
  if(o.dsMow < 5) blocked = 'soon';
  else if(o.recentWet || rain.status==='allwet') blocked = 'wet';
  else if(heat.status === 'allhot') blocked = 'hot';
  else if(!due) blocked = 'wait';
  /* Whichever cutoff comes first wins the day: beat the rain, or beat the heat. */
  const cutoffs = [heat.status==='before' ? heat.hour : null, rain.status==='before' ? rain.hour : null].filter(h=>h!=null);
  const before = cutoffs.length ? Math.min(...cutoffs) : null;
  /* "Overdue" needs a grace window. It used to be the same test as `due`, so the very first day
     mowing was recommended already shouted OVERDUE — which is most of what "it nags me every day"
     felt like. Two days past the trigger is genuinely late; before that it's just due. */
  return { due, blocked, ok: blocked===null, growthSpike, overdue: o.dsMow > 9, before,
           beforeWhy: before==null ? null : (rain.status==='before' && rain.hour===before ? 'rain' : 'heat') };
}
/* The full recommendation object, computed fresh each render (this is what makes it adaptive).
   dayOffset shifts the whole calculation forward a day so the home card can answer "will I need to
   do this tomorrow?" — the forecast already carries 7 days, nothing new is fetched. Everything
   moves together: the rain window, the odd/even sprinkling day, the heat scan, and days-since
   (which simply grows by the offset, since you can't log a future day). Overrides are a decision
   you made about today, so they don't project forward. */
function lawnStatus(dayOffset){
  const off = dayOffset || 0;
  const now=new Date(); now.setDate(now.getDate()+off);
  const season=lawnSeason(now);
  if(!season) return { season:null };
  const rules=SEASON_RULES[season], today=now.toLocaleDateString('en-CA'), num=v=>(v==null?0:+v);
  const dy=DB.wx && DB.wx.data && DB.wx.data.daily;
  let ti=-1, P=[], PP=[], HI=[]; if(dy){ ti=dy.time.indexOf(today); P=dy.precipitation_sum||[]; PP=dy.precipitation_probability_max||[]; HI=dy.temperature_2m_max||[]; }
  const havewx = ti>=0;
  const rain3 = havewx ? (num(P[ti])+num(P[ti-1])+num(P[ti-2])) : 0;   // that day + 2 prior days
  const rainTomorrow = havewx ? num(P[ti+1]) : 0;                      // only the next 24h counts as "imminent"
  const recentWet = havewx && (num(P[ti-1])>=0.1 || num(P[ti])>=0.1 || num(PP[ti])>=50);
  const dsWater=daysSinceLawn('watered')+off, dsMow=daysSinceLawn('mowed')+off;
  const log = off===0 ? ((DB.lawnLog||{})[today]||{}) : {};
  // ── WATERING ── (+ St. Louis Park ordinance: odd/even address days, no sprinkling noon–6pm)
  /* Heat tightens the interval to every allowed day: a 95°F stretch is exactly when cool-season
     grass gives up, and the odd/even ordinance already caps the real cadence at every other day. */
  const hotHi = havewx && rules.heatWater!=null ? Math.max(num(HI[ti]), num(HI[ti+1])) : 0;
  const heatOn = rules.heatWater!=null && hotHi >= rules.heatWater;
  const waterEvery = heatOn ? 1 : Math.ceil(7/rules.waterPerWeek);
  const heatNote = heatOn ? ` (${Math.round(hotHi)}°F ${num(HI[ti])>=num(HI[ti+1])?'today':'tomorrow'})` : '';
  const dom=now.getDate(), todayParity=dateParity(dom), sprinkleDayOK=(todayParity===LAWN_ADDR_PARITY);
  const water={ recommend:false, hard:false, unknown:false, override:!!log.overrideWater, text:'', every:waterEvery, heat:heatOn };
  /* Nothing logged yet is NOT a reason to stay silent — assume it's due and flag the guess. (This
     was the July regression: the ask-for-a-date state suppressed the recommendation entirely, so a
     lawn that genuinely needed water heard nothing at all.) */
  water.unknown = (dsWater === Infinity);
  if(water.override){ water.text='Watering anyway (override)'; water.recommend=true; }
  else if(dsWater < waterEvery){ water.text=`Watered ${dsFmt(dsWater)} — hold off`; }
  else if(havewx && rain3 >= rules.rainSkip){ water.text=`Rained recently (~${rain3.toFixed(2)}") — hold off`; water.hard=true; }
  /* Forecast rain suppresses only when it's imminent AND real. A maybe-shower three days out must
     never cost the lawn three dry days — that was the thing that felt wrong. */
  else if(havewx && rainTomorrow >= rules.rainSkip){ water.text=`Holding off — ~${rainTomorrow.toFixed(2)}" of rain expected tomorrow`; water.hard=true; }
  else if(!sprinkleDayOK){ const nx=nextSprinkleDate(); water.text=`City rule — ${LAWN_ADDR_PARITY} address sprinkles on ${LAWN_ADDR_PARITY} days only (today is the ${todayParity} ${ordinal(dom)})${nx?`; next ${nx}`:''}`; water.hard=true; }
  else { water.text = `Time to water${heatNote} — ${LAWN_HOURS_NOTE}${water.unknown?' · nothing logged yet, so this is a guess':` (last ${dsFmt(dsWater)})`}`; water.recommend=true; }
  // ── MOWING ── (rules live in mowVerdict so tomorrow's heads-up and the 7-day forecast match)
  const heat = lawnHeatWindow(rules.heatLimit, today);
  const when = off===0 ? 'today' : 'tomorrow';
  const v = mowVerdict({ dsMow, recentWet, rain3, heat, rain:lawnRainWindow(today), havewx });
  const mow={ recommend:false, hard:false, unknown:(dsMow===Infinity), override:!!log.overrideMow, text:'' };
  if(mow.override){ mow.text='Mowing anyway (override)'; mow.recommend=true; }
  else if(v.blocked==='soon'){ mow.text=`Last mowed ${dsFmt(dsMow)} — too soon`; }
  else if(v.blocked==='wet'){ mow.text='Wet conditions — don’t mow'; mow.hard=true; }
  else if(v.blocked==='hot'){ mow.text=`Too hot ${when} — don’t mow`; mow.hard=true; }
  else if(v.blocked==='wait'){ mow.text=`Last mowed ${dsFmt(dsMow)} — wait a day or two`; }
  else { mow.recommend=true;
    if(v.before!=null) mow.text=`Mow before ${fmtHour(v.before)} (before the ${v.beforeWhy})`;
    else if(mow.unknown) mow.text=`Mow ${when} — nothing logged yet, so this is a guess`;
    else if(v.overdue) mow.text=`Overdue — mow ${when} (8am–9pm)`;
    else mow.text=`Mow ${when} (8am–9pm)`;
  }
  return { season, dsWater, dsMow, water, mow, rain3, havewx, growthSpike:v.growthSpike };
}
/* ── "Expect to mow" — the same rules projected across the 7-day forecast ────────────────────
   Answers "which day am I mowing?" so there's lead time to gas up, sharpen and clear the yard.
   Derived only — no stored state. Null when off-season, before the location is set, or offline
   (each of those already hides the surrounding UI). */
function mowForecast(){
  if(!lawnSeason(new Date())) return null;
  if(!DB.lawn || DB.lawn.lat==null) return null;
  const dy = DB.wx && DB.wx.data && DB.wx.data.daily;
  if(!dy || !dy.time) return null;
  const ti = dy.time.indexOf(todayISO()); if(ti < 0) return null;
  const rules = SEASON_RULES[lawnSeason(new Date())], num = v=>(v==null?0:+v);
  const P = dy.precipitation_sum||[], PP = dy.precipitation_probability_max||[];
  const ds0 = daysSinceLawn('mowed');
  /* No mow ever logged → treat it as due (the strip's second pass keeps the days after it as a
     cooldown, so this no longer paints a week of green) and flag the guess for the copy. */
  const unknown = ds0===Infinity;
  /* Verdict for one forecast day. dsMow is passed in because the second pass below re-asks the
     question assuming the mow already happened. */
  const dayAt = (k, dsMow) => {
    const idx = ti+k, iso = dy.time[idx]; if(!iso) return null;
    const rain3 = num(P[idx]) + num(P[idx-1]) + num(P[idx-2]);
    const recentWet = num(P[idx-1])>=0.1 || num(P[idx])>=0.1 || num(PP[idx])>=50;
    const v = mowVerdict({ dsMow, recentWet, rain3, heat:lawnHeatWindow(rules.heatLimit, iso), rain:lawnRainWindow(iso), havewx:true });
    return Object.assign({ iso, k, dsMow }, v);
  };
  const days = [];
  for(let k=0;k<7;k++){ const d = dayAt(k, ds0 + k); if(!d) break; days.push(d); }
  const next = days.find(d=>d.ok) || null;
  /* Second pass: you mow ON the mow day, so the days after it are a cooldown, not six more mow
     days. Re-ask each later day with the clock reset to that mow. (Without this the strip showed
     a solid week of 🚜 — the same "every day is due" bug the unknown guard above fixes.) */
  if(next) for(let k=next.k+1;k<days.length;k++){ const d = dayAt(k, k - next.k); if(d) days[k] = d; }
  return { days, next, unknown };
}
function mowDayLabel(iso, k){ return k===0?'today':k===1?'tomorrow':new Date(iso+'T00:00').toLocaleDateString('en-US',{weekday:'long'}); }
/* The whole sentence, so the "nothing to say" cases read as sentences too — the callers used to
   prefix "Expect to mow " themselves, which produced "Expect to mow No clear window in…". */
function mowExpectText(f){
  if(!f) return '';
  if(!f.next) return 'No clear mowing window in the next 7 days — rain or heat blocks every day. Check back as the forecast moves.';
  const d = f.next, when = mowDayLabel(d.iso, d.k);
  const date = d.k>1 ? ` (${new Date(d.iso+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})})` : '';
  const qual = d.before!=null ? ` — before ${fmtHour(d.before)}, ahead of the ${d.beforeWhy}` : '';
  const guess = f.unknown ? ' — log your last mow to pin this down' : '';
  return `Expect to mow <strong>${when}</strong>${date}${qual}${guess}`;
}
/* Per-day marker for the outlook strip. */
function mowMark(d){
  if(d.ok) return { icon:'🚜', label:'mow', color:'var(--flag-fg)' };
  if(d.blocked==='wet') return { icon:'💧', label:'wet', color:'var(--chart)' };
  if(d.blocked==='hot') return { icon:'🔥', label:'hot', color:'var(--warm-fg)' };
  return { icon:'–', label:d.blocked==='soon'?'too soon':'not due', color:'var(--muted-2)' };
}
function mowOutlookHTML(){
  const f = mowForecast(); if(!f) return '';

      <div style="font-size:16px;margin:3px 0">${m.icon}</div>

  }).join('');
  return `<div class="card">

    ${f.unknown ? '' : `<div style="display:flex;gap:3px;margin-top:12px;overflow-x:auto">${strip}</div>`}
    <p class="muted" style="font-size:11px;margin-top:10px">Projects the same rules forward — about a week between mows (day 5 when rain has pushed growth), no mowing on wet grass, and the ${SEASON_RULES[lawnSeason(new Date())].heatLimit?`${SEASON_RULES[lawnSeason(new Date())].heatLimit}°F`:'heat'} window. Rain in the forecast moves it, so check the day before.</p>
  </div>`;
}
/* Write one day's lawn log. `iso` is any past date — forgetting to tap the button on the day is the
   normal case, and without this the schedule has no way to catch up. Future dates are refused
   because every days-since calculation assumes a log can only describe the past. */
function setLawnLog(iso, action, on){
  if(!iso || iso > todayISO()) return false;
  if(!DB.lawnLog) DB.lawnLog={};
  const e = DB.lawnLog[iso] || (DB.lawnLog[iso] = {});
  e[action] = !!on;
  if(action==='watered') e.overrideWater=false; if(action==='mowed') e.overrideMow=false;  // logging clears that override
  // keep the (possibly all-false) entry rather than deleting it — see toggleMobility on why absence is unsafe for sync
  save();
  return true;
}
function toggleLawnLog(action, iso){
  const t = iso || todayISO();
  const cur = ((DB.lawnLog||{})[t]||{})[action];
  if(!setLawnLog(t, action, !cur)) return;
  const when = t===todayISO() ? '' : ' for '+fmtDate(t);
  toast(!cur ? (action==='watered'?'Logged watering 💧'+when:'Logged mowing 🚜'+when) : 'Unlogged'+when);
  render();
}
/* Quick-set from the "when did you last do this?" prompt: n days ago, counted from today. */
function setLawnDaysAgo(action, n){
  const d=new Date(); d.setDate(d.getDate()-n);
  toggleLawnLog(action, d.toLocaleDateString('en-CA'));
}
/* Log an arbitrary date from the picker on the Lawn tab (for anything older than the 2-week list). */
function logLawnPastDate(action){
  const el=document.getElementById('lawn-past-date'); const iso=el && el.value;
  if(!iso){ toast('Pick a date first'); return; }
  if(((DB.lawnLog||{})[iso]||{})[action]){ toast('Already logged for '+fmtDate(iso)); return; }
  toggleLawnLog(action, iso);
}
/* First upcoming day the given task is recommended, using the SAME lawnStatus the card shows (its
   dayOffset already shifts the rain window, the odd/even sprinkling parity, the heat scan and
   days-since together). Null past the forecast horizon — better silent than an invented day. */
function nextDueDay(kind){
  for(let off=1; off<=6; off++){
    const s = lawnStatus(off); if(!s.season) continue;
    const r = kind==='water' ? s.water : s.mow;
    if(r && r.recommend && !r.unknown){ const d=new Date(); d.setDate(d.getDate()+off);
      return { off, label: off===1 ? 'tomorrow' : d.toLocaleDateString('en-US',{weekday:'short'}) }; }
  }
  return null;
}
function toggleLawnOverride(which){ const t=todayISO(); if(!DB.lawnLog) DB.lawnLog={}; const e=DB.lawnLog[t]||(DB.lawnLog[t]={});
  const key = which==='water'?'overrideWater':'overrideMow'; e[key]=!e[key];
  save(); render(); }
/* Home card. Quiet unless the lawn wants something: a task that's due gets a full block, one that
   isn't gets a single muted line with its reason and next expected day, and a day with nothing at
   all collapses to a heads-up or to nothing. `full` (Care → Lawn) always shows both in full —
   before, that view called this same function and hid the idle task exactly like the home card. */
function cLawnCard(full){
  const st=lawnStatus();
  if(!st.season || !DB.lawn || DB.lawn.lat==null) return '';   // hidden Nov–Mar or before location is set
  const asks = st.water.unknown || st.mow.unknown;
  if(!full && !asks && !st.water.recommend && !st.mow.recommend){
    const tm=lawnStatus(1);
    const due=[];
    if(tm.season && tm.water.recommend) due.push(`${ph('drop','lead')}Watering tomorrow — ${LAWN_HOURS_NOTE}`);
    if(tm.season && tm.mow.recommend)   due.push(`${ph('tractor','lead')}${esc(tm.mow.text)}`);
    /* Mowing further out still earns a line — that's the prep lead time — but only inside a 3-day
       window, so a quiet week stays quiet. Skipped when tomorrow's line already said it. */
    if(!(tm.season && tm.mow.recommend)){
      const f = mowForecast();
      if(f && f.next && f.next.k>0 && f.next.k<=3) due.push(`${ph('calendar-blank','lead')}${mowExpectText(f)}`);
    }
    if(!due.length) return '';
    return `<div class="card" style="cursor:pointer" onclick="goSub('care','lawn')">
      <div class="row"><div>${kicker('Lawn · heads up')}
        ${due.map(d=>`<div style="font-size:13px;line-height:1.5;margin-top:4px">${d}</div>`).join('')}
      </div><span class="muted">Lawn →</span></div>
    </div>`;
  }
  const t=todayISO(), log=(DB.lawnLog||{})[t]||{};
  /* Lead time to prep the mower. Skipped when mowing is already today's job (or already done) —
     the block above says it better. */
  const sep = 'margin-top:12px;padding-top:12px;border-top:1px solid var(--border-3)';
  /* The anchor row — offered whenever nothing has ever been logged. It rides ALONG with the
     recommendation now; the earlier version showed this INSTEAD of the recommendation, which is how
     a lawn that hadn't been watered in a week ended up hearing nothing at all. */
  const anchor=(action)=>`<div class="muted" style="font-size:11px;margin-top:10px">Last done:
      <span class="row" style="display:inline-flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        ${[['Today',0],['Yesterday',1],['2 days ago',2],['3 days ago',3]].map(([l,n])=>
          `<button class="btn btn-ghost btn-sm" style="min-width:70px" onclick="setLawnDaysAgo('${action}',${n})">${l}</button>`).join('')}
      </span></div>`;
  /* Full block — the task is due (or the Lawn tab asked for everything). */
  const block=(label,r,which,since,doneLabel,btnLabel,action,cadence)=> `<div style="${sep}">
      <div style="font-size:13px;line-height:1.5">${ph(r.override?'warning':(r.recommend?'check-circle':'pause'),'lead')}<strong>${label}:</strong> ${esc(r.text)}</div>
      <div class="muted" style="font-size:11px;margin-top:3px">${r.unknown?'No history yet':'Last '+since}${cadence?' · '+cadence:''}</div>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn ${log[which.log]?'':'btn-ghost'}" style="flex:1" onclick="toggleLawnLog('${which.log}')">${log[which.log]?`${ph('check')}${doneLabel}`:btnLabel}</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleLawnOverride('${which.ov}')">${r.override?`${ph('arrow-u-up-left')}Undo override`:'Override'}</button>
      </div>
      ${r.unknown?anchor(action):''}
    </div>`;
  /* Muted line — not due. Says why, and when it next will be, without taking over the card. This is
     the whole answer to "it stopped telling me about watering": the task is still on screen, just
     quiet. The prep nudge rides along when the next mow is tomorrow. */
  const quiet=(label,icon,r,next)=>`<div style="${sep}">
      <div class="muted" style="font-size:12px;line-height:1.5">${icon} <strong>${label}:</strong> ${esc(r.text)}${next?` · <span style="color:var(--accent-300);font-weight:600">next ${esc(next.label)}</span>`:''}</div>
      ${next && next.k===1 ? '<div style="font-size:12px;margin-top:4px;color:var(--warm-fg);font-weight:600">Get it ready tonight — gas, blade, yard clear.</div>' : ''}
    </div>`;
  const mowNext = (()=>{ const g=mowForecast(); return g && g.next && g.next.k>0 ? { k:g.next.k, label: mowDayLabel(g.next.iso, g.next.k) } : null; })();
  const ws = waterSession(st.water.every);
  const waterCadence = `${st.water.heat ? 'every allowed day while it’s 90°F+' : `every ~${st.water.every} days in ${st.season}`} · ~${ws.minutes} min (~${ws.inches.toFixed(2)}")`;
  const row=(label,icon,r,which,since,doneLabel,btnLabel,next,action,cadence)=>
    (full || r.recommend || r.unknown) ? block(label, r, which, since, doneLabel, btnLabel, action, cadence)
    : quiet(label, icon, r, next);
  return `<div class="card">
    ${full ? kicker('Lawn · '+st.season)
           : `<div class="row" style="cursor:pointer" onclick="goSub('care','lawn')">${kicker('Lawn · '+st.season)}<span class="muted">Lawn →</span></div>`}
    ${row('Watering','💧', st.water, {log:'watered', ov:'water'}, dsWithDate(st.dsWater), 'Watered', 'Mark watered', nextDueDay('water'), 'watered', waterCadence)}
    ${row('Mowing',  '🚜', st.mow,   {log:'mowed',   ov:'mow'},   dsWithDate(st.dsMow),   'Mowed',   'Mark mowed',   mowNext,               'mowed',   'about a week between mows')}
    ${asks?`<div class="muted" style="font-size:11px;margin-top:10px">Further back than 3 days? ${full?'Use the date picker with the history below.':'Care → Lawn has a date picker and a tappable 2-week history.'}</div>`:''}
    ${st.water.recommend||full?`<div class="muted" style="font-size:11px;margin-top:10px">Timing assumes a ~${SPRINKLER_IN_PER_HR}"/hr sprinkler — set a tuna can on the lawn once and time how long it takes to fill ½" to check yours.</div>`:''}
    ${st.water.recommend||full?`<div class="muted" style="font-size:11px;margin-top:10px">SLP ordinance: ${LAWN_ADDR_PARITY} address → sprinkle on ${LAWN_ADDR_PARITY} calendar days, never noon–6pm.</div>`:''}
  </div>`;
}
/* Past 2 weeks — every day is listed and every day is editable, because the common failure is
   doing the job and forgetting to tap the button. Tapping a pill logs or unlogs that date, and the
   whole schedule (days-since, the mow forecast, the watering interval) recomputes off it. */
function lawnHistory(){
  const log=DB.lawnLog||{}, rows=[];
  for(let n=0;n<14;n++){
    const d=new Date(); d.setDate(d.getDate()-n);
    const iso=d.toLocaleDateString('en-CA'), e=log[iso]||{};

        border:1px solid ${on?'var(--accent)':'var(--border-3)'};background:${on?'var(--accent-muted)':'transparent'};
        color:${on?'var(--accent-300)':'var(--muted-2)'}">${label}${on&&ov?' *':''}</button>`;
    rows.push(`<div class="hist-item">
      <span style="font-weight:600;font-size:13px;color:${n===0?'var(--text)':'var(--muted)'}">${n===0?'Today':new Date(iso+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span>
      <span style="display:flex;gap:6px">${pill(!!e.watered,'💧 Watered','watered',e.overrideWater)}${pill(!!e.mowed,'🚜 Mowed','mowed',e.overrideMow)}</span>
    </div>`);
  }
  return `<div class="card">
    <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Past 2 weeks</div>
    <p class="muted" style="font-size:12px;margin:6px 0 10px">Tap a day to add or correct it — forgot to log Sunday's mow? Fix it here and the schedule catches up. (* = logged against an override.)</p>
    <div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <input type="date" id="lawn-past-date" max="${todayISO()}" style="flex:1;min-width:130px;padding:8px">

      <button class="btn btn-sm btn-ghost" onclick="logLawnPastDate('mowed')">🚜 Mowed</button>

}
function viewLawn(){

  const d=wx.data, dy=d.daily, cur=d.current_weather, num=v=>(v==null?0:+v);

  const P=dy.precipitation_sum, PP=dy.precipitation_probability_max, HI=dy.temperature_2m_max, LO=dy.temperature_2m_min, WC=dy.weathercode;

  for(let k=0;k<7;k++){ const idx=ti+k; if(num(PP[idx])>=50 || num(P[idx])>=0.1){ rainTxt=`Rain likely <strong>${dayLabel(k,idx)}</strong>${num(PP[idx])?` (${num(PP[idx])}% chance, ~${num(P[idx]).toFixed(2)}")`:''}.`; break; } }

  return `<h1>Lawn & Weather</h1>${locBar}
    <div class="card">
      <div class="row"><div>
        <div class="stat-big" style="font-size:30px">${Math.round(num(cur?cur.temperature:HI[ti]))}°<span style="font-size:14px;color:var(--muted-2)">F</span></div>
        <div class="stat-sub">${cw.icon} ${cw.text} · H ${Math.round(num(HI[ti]))}° / L ${Math.round(num(LO[ti]))}°</div>
      </div><button class="btn btn-sm btn-ghost" onclick="fetchWeather()">${ph('arrows-clockwise')}</button></div>
      <div style="display:flex;gap:3px;margin-top:14px;overflow-x:auto">${strip}</div>
    </div>

    ${card('plant','Fertilizer', fert)}
    ${lawnSeason(new Date()) ? lawnHistory() : ''}
    <p class="muted" style="text-align:center;font-size:11px">Guidance blends hardcoded cool-season rules with the live forecast — use your judgment. Updated ${new Date(wx.at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}.</p>`;
}

function importData(inp){
  const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const raw=JSON.parse(r.result); if(!raw || !Array.isArray(raw.sessions) || !Array.isArray(raw.weights)) throw 0;
    const merge = confirm('Merge this backup with your current data?\n\nOK = MERGE (keeps both, nothing lost — recommended)\nCancel = choose replace instead');

      DB.lastBackupAt=Date.now(); save(); cloudVersion('import'); toast('Backup merged ✓'); render(); return;

      const wx=DB.wx; DB=normalize(raw); if(wx!==undefined) DB.wx=wx; DB.gen=g; DB.updatedAt=Date.now();

/* How much of the layout viewport the on-screen keyboard is currently covering. Single source of
   truth for "is the keyboard up" — used both to lift the tab bar clear of it and to decide whether
   a stopwatch tap should hold focus. */
function kbInset(){
  const vv = window.visualViewport; if(!vv) return 0;
  return Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
}
const keyboardUp = () => kbInset() > 4;
/* Tapping start/stop mid-set shouldn't dismiss the keyboard, hence the preventDefault that keeps
   focus on the input you're typing in. But that same held focus means that once you've dropped the
   keyboard with the chevron, the next tap invites iOS to bring it straight back. So only hold focus
   while the keyboard is actually up; otherwise blur, and it stays down. */
function swGuard(e){
  if(keyboardUp()){ e.preventDefault(); return; }
  const a = document.activeElement;
  if(a && a.blur) a.blur();
}
let sw = { running:false, start:0, acc:0 };
function swElapsed(){ return sw.acc + (sw.running ? Date.now()-sw.start : 0); }
function swToggle(){ if(sw.running){ sw.acc+=Date.now()-sw.start; sw.running=false; } else { sw.start=Date.now(); sw.running=true; } updateStopwatch(); }
function swClear(){ sw.running=false; sw.acc=0; updateStopwatch(); }
function updateStopwatch(){
  const bar=document.getElementById('stopwatch'); if(!bar) return;
  const show=!!DB.draft;                       // only during an active workout
  bar.style.display = show?'flex':'none';
  document.body.classList.toggle('sw-on', show);
  if(!show){ restCtx=null; return; }           // no draft → drop any stale rest context
  const t=document.getElementById('sw-time'); if(t) t.textContent=fmtDur(swElapsed());
  const b=document.getElementById('sw-toggle'); if(b) b.innerHTML = ph(sw.running?'pause':'play');
  const tgt=document.getElementById('sw-target'), el=Math.floor(swElapsed()/1000);
  const inWin = restCtx && el>=restCtx.lo && el<=restCtx.hi, overWin = restCtx && el>restCtx.hi;
  if(tgt){ tgt.textContent = restCtx ? ('Target '+restCtx.label) : ''; tgt.classList.toggle('in', !!inWin); }
  if(t){ t.classList.toggle('in', !!inWin); t.classList.toggle('over', !!overWin); }
}
/* Keep the rest bar (with its target) visible above the on-screen keyboard during a workout.
   VisualViewport shrinks when the keyboard opens; lift the fixed tab bar by that inset. */
(function(){
  const vv = window.visualViewport; if(!vv) return;
  const bar = document.querySelector('.tabbar'); if(!bar) return;
  const apply = () => {
    const inset = kbInset();

  };

/* ───────────────────────── Cardio log (manual + Strava file import) ─────────────────────────
   Stored canonically as { id, date, type, minutes, distanceKm, note, source }. Distance is kept
   in km internally and displayed in mi/km per the weight-unit preference. Strava .gpx computes
   distance (haversine over trackpoints) + elapsed time; .tcx reads structured laps; the bulk
   activities.csv is parsed row-by-row. Rolls up weekly minutes vs the ~150 min/week goal. */
const CARDIO_GOAL = 150;
const CARDIO_TYPES = ['Longboard','Walk','Run','Bike','Hike','Row','Swim','Elliptical','Other'];
let pendingCardio = null; // a single parsed import awaiting confirm
const distUnit = () => DB.unit==='kg' ? 'km' : 'mi';
const kmToDisp = km => DB.unit==='kg' ? km : km*0.621371;
const dispToKm = d => DB.unit==='kg' ? d : d/0.621371;
function fmtDist(km){ if(km==null||km==='') return ''; return (Math.round(kmToDisp(+km)*100)/100)+' '+distUnit(); }
function fmtMin(min){ min=Math.round(+min||0); if(min<60) return min+' min'; const h=Math.floor(min/60), m=min%60; return h+'h'+(m?' '+String(m).padStart(2,'0'):''); }
function cardioUid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function weeklyCardio(){ const m=+monday(new Date()); let min=0,km=0;
  liveCardio().forEach(c=>{ if(+monday(new Date(c.date+'T00:00'))===m){ min+=(+c.minutes||0); km+=(+c.distanceKm||0); } });
  // stair-stepper finisher counts toward cardio (per the program guide) — read live from logged sessions
  liveSessions().forEach(s=>{ const st=s.stairs;
    if(!s.skipped && st && !st.skipped && st.seconds!=='' && st.seconds!=null && +monday(new Date(s.date+'T00:00'))===m) min += (+st.seconds||0)/60; });
  return {min,km}; }
function haversineKm(a,b){ const R=6371, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s))); }
function mapCardioType(raw){ const s=String(raw||'').toLowerCase();
  if(s.includes('skate')||s.includes('board')) return 'Longboard';
  if(s.includes('run')) return 'Run';
  if(s.includes('walk')) return 'Walk';
  if(s.includes('hik')) return 'Hike';
  if(s.includes('ride')||s.includes('bik')||s.includes('cycl')) return 'Bike';
  if(s.includes('row')) return 'Row';
  if(s.includes('swim')) return 'Swim';
  if(s.includes('ellip')) return 'Elliptical';
  return 'Longboard'; } // default to his main activity; editable before save

function pickCardioFile(){ const el=document.getElementById('cardio-file'); if(el) el.click(); }
function handleCardioFile(inp){

function parseGPX(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  const pts=[...doc.getElementsByTagName('trkpt')]; if(!pts.length) return null;
  let km=0, prev=null, firstT=null, lastT=null;

    const tEl=p.getElementsByTagName('time')[0], t=tEl?Date.parse(tEl.textContent):NaN;
    if(!isNaN(t)){ if(firstT==null)firstT=t; lastT=t; }
    if(prev && !isNaN(lat) && !isNaN(lon)) km+=haversineKm(prev,{lat,lon}); if(!isNaN(lat)&&!isNaN(lon)) prev={lat,lon}; });
  const minutes = (firstT!=null&&lastT!=null) ? Math.max(0,(lastT-firstT)/60000) : 0;
  const date = firstT!=null ? new Date(firstT).toLocaleDateString('en-CA') : todayISO();

function parseTCX(text){

/* Minimal CSV reader honoring quoted fields and embedded newlines. */
function csvRows(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else if(c==='"') q=true;
    else if(c===',') { row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else if(c!=='\r') field+=c; }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function parseStravaCSV(text){
  const rows=csvRows(text); if(rows.length<2) return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const idx=names=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; }
    for(let i=0;i<head.length;i++){ if(names.some(n=>head[i].includes(n))) return i; } return -1; };
  const iDate=idx(['activity date','date']), iType=idx(['activity type','type']),
        iMov=idx(['moving time']), iEla=idx(['elapsed time']), iDist=idx(['distance']);
  const out=[];
  for(let r=1;r<rows.length;r++){ const row=rows[r]; if(!row||!row.length) continue;
    const dRaw=iDate>=0?row[iDate]:''; const d=dRaw?new Date(dRaw):null;
    const date = d && !isNaN(d) ? d.toLocaleDateString('en-CA') : null; if(!date) continue;

  }

}

/* ───────────────────────── Merge (union) — the fix for the 2026-07-25 data loss ─────────────
   The old sync was last-write-wins on a whole-DB blob, and `updatedAt` was wall-clock bumped on
   EVERY save (even the weather cache). So a device 4 days STALE could hold the newer timestamp,
   blind-`set()` over the cloud, and the other device would then adopt it — 4 days of weigh-ins and
   a workout gone. Now both sides are UNIONED, so a stale device can never subtract data.
   Per-field strategy is deliberate; see the comments — several obvious choices are wrong. */
function mergeUnion(aArr, bArr, keyOf, newerFirst){
  /* Union by key. A key collision is resolved by per-item `mtime` (stamped on every create/edit/
     delete) so the most recent real ACTION wins — including a delete. Falling back to the
     whole-DB newerFirst ordering when neither side has an mtime keeps legacy rows behaving as
     before. This per-item resolution is what makes "delete on phone / re-add on an offline
     laptop" come out right; a tombstone map would have silently dropped the re-add. */
  const out=[], idx=new Map();
  const consider=(it, fromNewerSide)=>{
    if(!it || typeof it!=='object') return;
    const k=keyOf(it), prev=idx.get(k);
    if(prev===undefined){ idx.set(k, out.length); out.push(it); return; }
    const cur=out[prev], curT=+cur.mtime||0, newT=+it.mtime||0;
    if(newT>curT || (newT===curT && fromNewerSide)) out[prev]=it;   // strictly newer action wins; ties fall back to side
  };
  const first = newerFirst? bArr : aArr, second = newerFirst? aArr : bArr;
  (first||[]).forEach(it=>consider(it, true));
  (second||[]).forEach(it=>consider(it, false));
  return out;
}
/* Session key: prefer the stable id; fall back to content for pre-id rows (migration 12 backfills,
   but MIGRATIONS is wrapped in a silent try/catch so never trust it alone). */
const sessKey = s => s.id || ('c_'+(s.date||'')+'|'+(s.workout||'')+'|'+(s.endedAt||'')+'|'+(s.skipped?'1':'0'));
const todoKey = t => (t.created||'')+'|'+(t.text||'');
const hobbyKey = h => (h.date||'')+'|'+(h.item||h.hobby||'')+'|'+(h.cat||'');
function mergeJournalEntry(x, y, yNewer){
  /* Line-level union: logToJournal appends lines, so the usual conflict is one side being a
     superset. "Longer string wins" would silently drop a whole day's note. */
  const A=String(x||''), B=String(y||'');
  if(A===B) return A;
  if(!A.trim()) return B; if(!B.trim()) return A;
  const first = yNewer? B : A, second = yNewer? A : B;
  const lines=[], seen=new Set();
  first.split('\n').concat(second.split('\n')).forEach(ln=>{ const k=ln.trim(); if(!k){ return; } if(seen.has(k)) return; seen.add(k); lines.push(ln); });
  return lines.join('\n');
}
function mergeDateMap(a, b, bNewer, innerMerge){
  const out={}, keys=new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
  keys.forEach(k=>{
    const av=(a||{})[k], bv=(b||{})[k];
    if(av===undefined){ out[k]=bv; return; }
    if(bv===undefined){ out[k]=av; return; }
    out[k] = innerMerge ? innerMerge(av,bv,bNewer) : (bNewer? bv : av);
  });
  return out;
}
/* localWins: on a straight tie (same updatedAt) prefer `local`. Used after a round trip so
   keystrokes typed while the transaction was in flight aren't discarded. */
function mergeDB(remote, local, localWins){
  const r = remote && typeof remote==='object' ? remote : {};
  const l = local  && typeof local==='object'  ? local  : {};
  /* Wholesale replace: "Erase all data" and Import→Replace bump `gen`. Without this the union
     below would pull every erased row straight back from the cloud, so both of those actions
     silently did nothing. A higher generation replaces everything, no key enumeration needed. */
  const rG = +r.gen || 0, lG = +l.gen || 0;
  if(rG !== lG){
    const win = Object.assign({}, blank(), lG > rG ? l : r);
    win.gen = Math.max(rG, lG);
    win.updatedAt = Math.max(+r.updatedAt||0, +l.updatedAt||0);
    win._schema = Math.max(+r._schema||0, +l._schema||0, SCHEMA);
    delete win.wx;
    return win;
  }
  const rU = +r.updatedAt || 0, lU = +l.updatedAt || 0;
  const localNewer = localWins ? (lU >= rU) : (lU > rU);
  const newer = localNewer ? l : r, older = localNewer ? r : l;
  const out = Object.assign({}, blank(), older, newer); // start from newer's scalars, guarantee all blank() keys
  // ── append-only logs: union, never subtract ──
  out.sessions = mergeUnion(r.sessions, l.sessions, sessKey, localNewer);
  out.weights  = mergeUnion(r.weights,  l.weights,  w=>w.date, localNewer);
  out.petWeights = mergeUnion(r.petWeights, l.petWeights, w=>w.date, localNewer);  // one cat weigh-in per date, same key rule as weights
  out.cardio   = mergeUnion(r.cardio,   l.cardio,   c=>c.id || ((c.date||'')+'|'+(c.type||'')+'|'+(c.minutes||'')), localNewer);
  out.ideas    = mergeUnion(r.ideas,    l.ideas,    i=>i.id || ((i.date||'')+'|'+(i.text||'')), localNewer);
  out.todos    = mergeUnion(r.todos,    l.todos,    todoKey, localNewer);
  out.hobbyLog = mergeUnion(r.hobbyLog, l.hobbyLog, hobbyKey, localNewer);
  // ── date-keyed maps ──
  out.journal = mergeDateMap(r.journal, l.journal, localNewer, (a,b,bN)=>mergeJournalEntry(a,b,bN));
  /* mobilityLog / lawnLog: take the WHOLE inner object from the newer side. Do NOT union inner
     keys — these encode "off" as false/absent, and unioning resurrects unchecked boxes forever. */
  out.mobilityLog = mergeDateMap(r.mobilityLog, l.mobilityLog, localNewer, null);
  out.lawnLog     = mergeDateMap(r.lawnLog,     l.lawnLog,     localNewer, null);
  /* draft: already set correctly by Object.assign(newer) above — same recency rule as every other
     field. BUG FIXED HERE (2026-07-25): this used to be `localDraft || remoteDraft || null`, which
     picked whichever side had ANY non-null draft, ignoring which side was actually newer. Once a
     stale non-null draft existed anywhere (a device's memory, or the cloud doc from before a
     workout was finished), it won FOREVER — finishing/discarding sets draft:null, but null could
     never beat a stale non-null value, so the old workout kept getting resurrected on every merge
     and re-pushed via the live listener, looping endlessly across every device. Only guard against
     a corrupt/unknown workout name here (would crash viewActive's PROGRAM[name] lookup). */
  if(out.draft && !PROGRAM[out.draft.workout]) out.draft = null;
  // ── invariants ──
  out.weights.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  out.petWeights.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  out.sessions.sort((a,b)=> a.date===b.date ? ((a.endedAt||0)-(b.endedAt||0)) : String(a.date).localeCompare(String(b.date)));
  out._schema = Math.max(+r._schema||0, +l._schema||0, SCHEMA);
  out.updatedAt = Math.max(rU, lU);
  delete out.wx; // weather is derived cache — excluded from sync entirely (see saveLocal)
  return out;
}

/* Adopt a merged DB locally WITHOUT re-pushing. Snapshots the outgoing state first — this is the
   line that silently destroyed 4 days of data when it was a blind overwrite with no backup. */
function adoptMerged(merged, label){

    const wx = DB.wx;                                               // keep this device's weather cache (not synced)
    /* `merged` never carries wx (stripped from every synced blob) but DB almost always does, so
       comparing them directly was ALWAYS unequal — the "nothing changed" guard below never fired
       in practice, causing a render + "Synced from another device" toast on nearly every listener
       tick even when no real content had changed. Compare apples-to-apples by reattaching wx first. */
    const withWx = Object.assign({}, merged); if(wx!==undefined) withWx.wx = wx;
    if(JSON.stringify(withWx)===JSON.stringify(DB)) return false;   // nothing changed; don't churn the UI

const SYNCED_UID_KEY='ppl_synced_uid'; // device-local: which account this device has already linked to

function startLiveSync(){

/* Every remote write goes through here. It is a transaction that READS the current cloud copy and

async function pushNow(silent){

  if(!SYNC.reconciled){ SYNC.pending=true; if(!silent) toast('Still connecting — will sync shortly'); scheduleRetry(); return; }
  if(!DB.updatedAt) DB.updatedAt=Date.now();

  let merged = null, wrote = false;

    await fbDb.runTransaction(async tx=>{
      const snap = await tx.get(SYNC.docRef);

      tx.set(SYNC.docRef, { blob, updatedAt: merged.updatedAt||Date.now(), schema: SCHEMA, at: Date.now() });
      wrote = true;
    });
    SYNC.pending=false;
    /* DB may have moved on while the round trip was in flight (setVal saves on every keystroke),
       so fold the result back in with LOCAL winning ties, and re-push if that differs. */
    if(merged){
      const reconciled = mergeDB(merged, DB, true);
      adoptMerged(reconciled, 'after-push-merge');
      if(wrote && JSON.stringify(reconciled)!==JSON.stringify(merged)) schedulePush();
    }

       plain set(), which is the blind overwrite we just removed. */
    if(/unavailable|deadline-exceeded|failed-precondition|network/i.test(code+(e&&e.message||''))){

      if(!silent) toast('Offline — will sync later'); scheduleRetry();
    } else {

    }
  }

   good copy lives on the OTHER device, which is exactly what happened. So we also keep CLOUD
   versions at users/{uid}/versions. Requires a Firestore rules update (rules do NOT cascade to

const CLOUD_VERSIONS_MAX = 20, VERSION_MIN_GAP = 15*60*1000;

  if(!checkpoint && now-lastVersionAt < VERSION_MIN_GAP) return;   // setVal saves every keystroke — don't write 100 versions/session
  lastVersionAt = now;

    SYNC.docRef.collection('versions').add({
      blob: JSON.stringify(payload), label: label||'auto', at: now,
      device: (navigator.userAgent||'').slice(0,120),
      summary: snapSummary(payload)

  }catch(e){}

function pruneCloudVersions(){

    .then(qs=>{ const docs=qs.docs; for(let i=CLOUD_VERSIONS_MAX;i<docs.length;i++) docs[i].ref.delete().catch(()=>{}); })
    .catch(()=>{});

  if(SYNC.user){
    return `<div class="card">
      <div class="row"><div><div style="font-weight:700">${ph('check-circle','lead')}Connected</div><div class="muted" style="font-size:12px">${esc(SYNC.user.email||'')}</div></div><span class="flag">${SYNC.pending?'Pending':'Sync on'}</span></div>
      <p class="muted" id="sync-last" style="margin:10px 0 4px">${SYNC.lastSyncAt?('Last synced: '+new Date(SYNC.lastSyncAt).toLocaleString()):'Not synced yet'}</p>
      <p class="muted" id="sync-status" style="margin:0 0 12px">${esc(SYNC.status||'')}</p>
      <button class="btn btn-block" onclick="pushNow(false)">⟳ Check for updates</button>
      <p class="muted" style="font-size:11px;margin-top:8px">Safe to tap anytime — it merges both devices and never replaces newer data.</p>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="syncSignOut()">Sign out</button>
    </div>`;
  }
  return `<div class="card">
    <p class="muted" style="margin-bottom:12px">Sign in with the <strong>same email + password on every device</strong> to keep your data in sync. Your data is private to your login.</p>
    <input id="sync-email" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:8px">
    <input id="sync-pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" style="margin-bottom:12px">
    <button class="btn btn-block" onclick="syncSignIn(false)">Sign in</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="syncSignIn(true)">Create account</button>
    <p class="muted" id="sync-status" style="margin-top:10px">${esc(SYNC.status||'')}</p>
  </div>`;
}

/* ───────────────────────── Idea / feedback capture ─────────────────────────
   Floating 💡 opens a bottom sheet to jot dev ideas in-context. Stored in DB.ideas
   (syncs via the Firebase blob) and lives OUTSIDE render() — the sheet is static markup,
   so it survives tab switches. "Copy all" hands you a markdown list to paste into a dev chat. */
function ideaUid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function openIdeas(){ const m=document.getElementById('ideas-modal'); if(!m) return; m.classList.add('show'); editingIdeaId=null; renderIdeasList(); const t=document.getElementById('idea-input'); if(t) t.focus(); }
function closeIdeas(){ const m=document.getElementById('ideas-modal'); if(m) m.classList.remove('show'); }
function addIdea(){ const el=document.getElementById('idea-input'); const v=((el&&el.value)||'').trim(); if(!v) return; if(!DB.ideas) DB.ideas=[]; DB.ideas.unshift(touch({id:ideaUid(), text:v, date:todayISO(), done:false})); save(); if(el) el.value=''; renderIdeasList(); toast('Idea saved 💡'); }
function removeIdea(id){ if(!softDelete(DB.ideas, x=>x.id===id)) return; if(editingIdeaId===id) editingIdeaId=null; save(); renderIdeasList(); }
function toggleIdeaDone(id){ const it=(DB.ideas||[]).find(x=>x.id===id); if(!it) return; it.done=!it.done; touch(it); save(); renderIdeasList(); }
/* Reword an idea in place. Half-remembered notes get sharper once you've slept on them, and
   delete-and-retype loses the original date. */
let editingIdeaId = null;
function startEditIdea(id){ editingIdeaId=id; renderIdeasList();
  const t=document.getElementById('idea-edit-'+id); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
function cancelEditIdea(){ editingIdeaId=null; renderIdeasList(); }
function saveEditIdea(id){
  const el=document.getElementById('idea-edit-'+id), v=((el&&el.value)||'').trim();
  const it=(DB.ideas||[]).find(x=>x.id===id);
  editingIdeaId=null;
  if(!it || !v || v===it.text){ renderIdeasList(); return; }   // blank or unchanged → just close
  it.text=v; touch(it);   // touch() so the sync merge sees the edit as newer, or another device reverts it
  save(); renderIdeasList(); toast('Idea updated');
}
function renderIdeasList(){
  const list=liveIdeas(), box=document.getElementById('ideas-list'), cnt=document.getElementById('idea-count');
  if(cnt) cnt.textContent = list.length ? `${list.filter(i=>!i.done).length} open · ${list.length} total` : '';
  if(!box) return;
  box.innerHTML = list.length ? list.map(i=> i.id===editingIdeaId ? `<div class="idea-item">
    <div style="flex:1">
      <textarea id="idea-edit-${i.id}" rows="3" style="resize:vertical;line-height:1.5;min-height:64px">${esc(i.text)}</textarea>
      <div class="row" style="gap:8px;margin-top:8px">
        <button class="btn btn-sm" style="flex:1" onclick="saveEditIdea('${i.id}')">Save</button>
        <button class="btn btn-sm btn-ghost" style="flex:1" onclick="cancelEditIdea()">Cancel</button>
      </div>
    </div>
  </div>` : `<div class="idea-item${i.done?' done':''}">
    <input type="checkbox" ${i.done?'checked':''} onchange="toggleIdeaDone('${i.id}')" style="margin-top:2px">
    <span class="txt">${esc(i.text)}<span class="muted" style="font-size:11px"> · ${fmtDate(i.date)}</span></span>
    <button class="x-set" onclick="startEditIdea('${i.id}')" title="edit">${ph('pencil-simple')}</button>
    <button class="x-set" onclick="removeIdea('${i.id}')" title="delete">${ph('x')}</button>
  </div>`).join('') : '<p class="muted" style="font-size:13px;padding:8px 0">No ideas yet — add one above while you\'re using the app.</p>';
}
function copyIdeas(){
  const list=liveIdeas(); if(!list.length){ toast('No ideas to copy'); return; }
  const text = `PPL Tracker — ideas (${list.length})\n` + list.map(i=>`- [${i.done?'x':' '}] ${i.text} (${fmtDate(i.date)})`).join('\n');
  const done=()=>toast('Copied ✓ — paste it to me');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, cb){ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); cb(); }catch(e){ toast('Copy failed'); } }

/* ───────────────────────── Boot ───────────────────────── */
/* The stopwatch bar, the idea FAB and its sheet live as static markup in <body>, so they can't
   call ph() inside a template literal like every view does — they declare data-ph instead and
   get their icon prepended once here. Re-rendered views don't need this; they call ph() directly. */
document.querySelectorAll('[data-ph]').forEach(el => { el.innerHTML = ph(el.dataset.ph) + el.innerHTML; });
buildTabBar();
render();
updateStopwatch();
</script>
</body>
