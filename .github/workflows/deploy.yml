name: Deploy to GitHub Pages

# Reliable replacement for the legacy "Deploy from a branch" builder,
# which intermittently stalled (build OK, deploy stuck/queued).

on:
  push: # every branch runs the checks; only main goes on to deploy (see the job's `if`)
  pull_request:
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate. The app is the only copy of two months of training data, and the sync rules below it have
  # already destroyed data once (2026-07-25). A red check must never reach the phone.
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago # the suite freezes the clock; the rules are hour- and date-sensitive
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run checks
        run: node test/app.test.js

  deploy:
    needs: test # no green, no deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Stamp the published copy with its deploy time and commit, shown in Settings → This version.
      # Only this job's checkout is changed; the repo keeps the placeholder. It stamps only the
      # ppl-build meta's attribute, which sits outside the inline script, so the published script's
      # bytes equal the repo's. That is what a hash-based CSP needs. Fails loudly unless the
      # placeholder appears exactly once, so a stamp can't silently miss or hit the wrong text.
      - name: Stamp build
        run: |
          test "$(grep -c '__BUILD_STAMP__' index.html)" = 1
          sed -i "s/content=\"__BUILD_STAMP__\"/content=\"$(date -u +%Y-%m-%dT%H:%M:%SZ) ${GITHUB_SHA::7}\"/" index.html
          grep -q '<meta name="ppl-build" content="[0-9T:Z-]* [0-9a-f]\{7\}"' index.html
      # Verify, never compute. The Content-Security-Policy pins the inline script by sha256, and that
      # hash is made by hand with `npm run csp:hash` and committed. This fails the deploy if the
      # stamped copy's inline script no longer matches its policy, so a page every browser would
      # refuse to run (a blank app) can never be published. It lives in the CSP commit, so reverting
      # the CSP removes it too.
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the published script still matches its CSP hash
        run: node scripts/csp-hash.js --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # single-file app lives at the repo root
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
